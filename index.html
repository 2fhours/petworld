<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pet World</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body {
      display: grid;
      place-items: center;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #87c8f5;
      color: #fff;
      cursor: none;
    }
    .scene {
      position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none;
    }
    .sky {
      position: absolute; inset: 0;
      background: linear-gradient(180deg, #7ec8f8 0%, #b8e4ff 42%, #fff6d8 78%, #c8eb9c 100%);
      transition: background 0.6s ease;
    }
    .sun {
      position: absolute; top: 8%; right: 12%; width: 86px; height: 86px; border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fff7b0, #ffd35a 55%, #ffb02e 100%);
      box-shadow: 0 0 40px rgba(255, 205, 80, 0.65);
    }
    .cloud {
      position: absolute; background: rgba(255,255,255,0.92); border-radius: 40px;
      filter: drop-shadow(0 6px 10px rgba(80,120,160,0.12));
      animation: cloudMove linear infinite;
    }
    .cloud::before, .cloud::after {
      content: ""; position: absolute; background: inherit; border-radius: 50%;
    }
    .cloud.a { width: 120px; height: 40px; top: 12%; left: -20%; animation-duration: 48s; }
    .cloud.a::before { width: 50px; height: 50px; top: -24px; left: 18px; }
    .cloud.a::after { width: 66px; height: 66px; top: -30px; left: 48px; }
    .cloud.b { width: 160px; height: 46px; top: 20%; left: -30%; animation-duration: 64s; animation-delay: -20s; }
    .cloud.b::before { width: 60px; height: 60px; top: -28px; left: 26px; }
    .cloud.b::after { width: 78px; height: 78px; top: -36px; left: 66px; }
    .hill {
      position: absolute; left: -10%; right: -10%; bottom: 14%; height: 34%;
      border-radius: 50% 50% 0 0;
      background: linear-gradient(180deg, #8fd18a, #62b36b);
    }
    .hill.back {
      bottom: 18%; height: 38%; opacity: 0.75;
      background: linear-gradient(180deg, #a8db9a, #79c27a);
      transform: scaleX(1.05);
    }
    .ground {
      position: absolute; left: 0; right: 0; bottom: 0; height: 22%;
      background:
        radial-gradient(circle at 20% 30%, rgba(255,255,255,0.18), transparent 24%),
        linear-gradient(180deg, #79c45d 0%, #5aa84a 55%, #4e9440 100%);
    }
    .ground::before {
      content: ""; position: absolute; inset: 0;
      background-image: repeating-linear-gradient(90deg, transparent 0 18px, rgba(70,140,50,0.12) 18px 20px);
      opacity: 0.35;
    }
    .decor {
      position: absolute; bottom: 18%; font-size: 42px; line-height: 1;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.12));
      transition: opacity 0.35s ease, transform 0.35s ease;
    }
    .decor.d1 { left: 8%; font-size: 52px; }
    .decor.d2 { left: 22%; bottom: 20%; font-size: 34px; }
    .decor.d3 { right: 18%; bottom: 21%; font-size: 48px; }
    .decor.d4 { right: 8%; bottom: 17%; font-size: 36px; }
    @keyframes cloudMove {
      from { transform: translateX(0); }
      to { transform: translateX(140vw); }
    }
    /* pet-themed environments */
    body.env-cat .sky { background: linear-gradient(180deg, #9ad0ff 0%, #ffe3f0 55%, #d9f5b8 100%); }
    body.env-dog .sky { background: linear-gradient(180deg, #87c8f5 0%, #fff1c9 55%, #b7e38a 100%); }
    body.env-bunny .sky { background: linear-gradient(180deg, #b7e0ff 0%, #ffe8f5 50%, #d8f7c6 100%); }
    body.env-fox .sky { background: linear-gradient(180deg, #7eb6e8 0%, #ffd7a8 48%, #8fbf6e 100%); }
    body.env-panda .sky { background: linear-gradient(180deg, #8ec9a8 0%, #d7f0ff 45%, #bfe39a 100%); }
    body.env-fox .hill { background: linear-gradient(180deg, #7fba72, #4f8f4d); }
    body.env-panda .hill { background: linear-gradient(180deg, #79c98c, #4f9a62); }

    canvas#fx {
      position: fixed; inset: 0; width: 100%; height: 100%;
      z-index: 1; display: block; opacity: 0.35; mix-blend-mode: soft-light;
    }
    .aura {
      position: fixed; width: 55vmax; height: 55vmax; border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.22), transparent 65%);
      filter: blur(40px); animation: drift 12s ease-in-out infinite alternate;
      z-index: 1; pointer-events: none;
    }
    .aura.two {
      background: radial-gradient(circle, rgba(255,220,120,0.2), transparent 65%);
      animation-duration: 16s; animation-direction: alternate-reverse;
      right: -10vmax; bottom: -10vmax;
    }
    .cursor {
      position: fixed; width: 14px; height: 14px; border-radius: 50%;
      background: rgba(255,255,255,0.9);
      box-shadow: 0 0 20px rgba(167,139,250,0.9), 0 0 40px rgba(103,232,249,0.5);
      transform: translate(-50%, -50%); pointer-events: none; z-index: 9;
      mix-blend-mode: screen;
    }

    /* Character picker */
    .picker {
      position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
      z-index: 8; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
      padding: 8px; border-radius: 18px;
      background: rgba(15,23,42,0.55); border: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(10px); max-width: calc(100vw - 24px);
    }
    .picker button {
      appearance: none; border: 1px solid transparent; border-radius: 14px;
      padding: 8px 10px; min-width: 64px; font: inherit; font-size: 12px;
      color: #e2e8f0; background: rgba(255,255,255,0.05); cursor: pointer;
      transition: 0.15s ease;
    }
    .picker button.active {
      border-color: rgba(167,139,250,0.7);
      background: rgba(167,139,250,0.22);
    }
    .picker button:hover { transform: translateY(-1px); background: rgba(255,255,255,0.1); }
    .picker .emoji { display: block; font-size: 20px; line-height: 1.2; }

    .hint {
      position: fixed; top: 78px; left: 50%; transform: translateX(-50%);
      z-index: 7; font-size: 12px; color: rgba(226,232,240,0.55);
      pointer-events: none; white-space: nowrap;
    }

    /* Pet shell */
    #pet {
      position: fixed; left: 0; top: 0; width: 152px; height: 172px;
      z-index: 5; transform: translate(-50%, -100%);
      cursor: pointer; user-select: none; touch-action: none;
    }
    /* Expand tap target; figure inset keeps visual size ~same */
    #pet::before {
      content: ""; position: absolute; inset: -6px -10px -4px;
      pointer-events: auto;
    }
    #pet .bubble {
      position: absolute; left: 50%; top: -6px;
      transform: translate(-50%, -100%) scale(0.92);
      background: rgba(15,23,42,0.88); border: 1px solid rgba(255,255,255,0.12);
      color: #e2e8f0; font-size: 18px; font-weight: 650; padding: 8px 14px; border-radius: 14px;
      white-space: nowrap; opacity: 0; pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
      transform-origin: 50% 100%;
    }
    #pet .bubble.show {
      opacity: 1; transform: translate(-50%, -110%) scale(1);
    }
    #pet .shadow {
      position: absolute; left: 50%; bottom: 12px; width: 58px; height: 14px;
      transform: translateX(-50%);
      background: radial-gradient(ellipse, rgba(0,0,0,0.4), transparent 70%);
      filter: blur(2px);
    }
    #pet .figure {
      position: absolute; inset: 16px 22px 18px; transform-origin: 50% 100%;
      transform: scaleX(var(--face, 1));
    }

    /* Shared limb animation */
    #pet.walk .leg-l { animation: legL 0.55s ease-in-out infinite; }
    #pet.walk .leg-r { animation: legR 0.55s ease-in-out infinite; }
    #pet.walk .arm-l { animation: armL 0.55s ease-in-out infinite; }
    #pet.walk .arm-r { animation: armR 0.55s ease-in-out infinite; }
    #pet.walk .figure { animation: bob 0.55s ease-in-out infinite; }
    #pet.happy .figure { animation: hop 0.9s ease; }

    /* Pet body play motions */
    #pet.acting { z-index: 6; }
    #pet.acting .figure { transform-origin: 50% 100%; }
    #pet.play-swim .figure { animation: petSwim 0.7s ease-in-out infinite; }
    #pet.play-swim .arm-l { animation: petSwimArmL 0.55s ease-in-out infinite; }
    #pet.play-swim .arm-r { animation: petSwimArmR 0.55s ease-in-out infinite; }
    #pet.play-swim .leg-l, #pet.play-swim .leg-r { animation: petSwimKick 0.55s ease-in-out infinite; }
    #pet.play-basketball .figure { animation: petBallJump 0.85s ease-in-out infinite; }
    #pet.play-basketball .arm-l, #pet.play-basketball .arm-r { animation: petArmsUp 0.85s ease-in-out infinite; }
    #pet.play-soccer .leg-r { animation: petKick 0.7s ease-in-out infinite; }
    #pet.play-soccer .arm-l, #pet.play-soccer .arm-r { animation: petBalanceArm 0.7s ease-in-out infinite; }
    #pet.play-soccer .figure { animation: petSoccerLean 0.7s ease-in-out infinite; }
    #pet.play-dance .figure { animation: petDance 0.55s ease-in-out infinite; }
    #pet.play-dance .arm-l { animation: petDanceArmL 0.55s ease-in-out infinite; }
    #pet.play-dance .arm-r { animation: petDanceArmR 0.55s ease-in-out infinite; }
    #pet.play-dance .leg-l { animation: legL 0.45s ease-in-out infinite; }
    #pet.play-dance .leg-r { animation: legR 0.45s ease-in-out infinite; }
    #pet.play-run .figure { animation: petRunBob 0.28s ease-in-out infinite; }
    #pet.play-run .leg-l { animation: legL 0.28s ease-in-out infinite; }
    #pet.play-run .leg-r { animation: legR 0.28s ease-in-out infinite; }
    #pet.play-run .arm-l { animation: armL 0.28s ease-in-out infinite; }
    #pet.play-run .arm-r { animation: armR 0.28s ease-in-out infinite; }
    #pet.play-jump .figure { animation: petBigJump 0.9s ease-in-out infinite; }
    #pet.play-jump .arm-l, #pet.play-jump .arm-r { animation: petArmsUp 0.9s ease-in-out infinite; }
    #pet.play-frisbee .arm-r { animation: petThrow 0.8s ease-in-out infinite; }
    #pet.play-frisbee .figure { animation: petThrowLean 0.8s ease-in-out infinite; }
    #pet.play-bike .figure { animation: petBikeSit 0.45s ease-in-out infinite; }
    #pet.play-bike .leg-l { animation: petPedalL 0.45s linear infinite; }
    #pet.play-bike .leg-r { animation: petPedalR 0.45s linear infinite; }
    #pet.play-bike .arm-l, #pet.play-bike .arm-r { transform: rotate(-40deg); }
    .fx-prop.mini { font-size: 28px !important; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.25)); }
    .fx-prop.ball-follow { animation: ballFollowKick 3.2s ease-in-out forwards; }
    .fx-prop.bball-follow { animation: bballFollow 3.2s ease-in-out forwards; }
    .fx-prop.frisbee-follow { animation: frisbeeFly 3.2s ease-in-out forwards; font-size: 26px !important; }
    @keyframes petSwim {
      0%,100% { transform: scaleX(var(--face,1)) translate(0, 8px) rotate(-6deg); }
      50% { transform: scaleX(var(--face,1)) translate(10px, -2px) rotate(6deg); }
    }
    @keyframes petSwimArmL { 0%,100%{transform:rotate(70deg)} 50%{transform:rotate(120deg)} }
    @keyframes petSwimArmR { 0%,100%{transform:rotate(-70deg)} 50%{transform:rotate(-120deg)} }
    @keyframes petSwimKick { 0%,100%{transform:rotate(25deg)} 50%{transform:rotate(-30deg)} }
    @keyframes petBallJump {
      0%,100% { transform: scaleX(var(--face,1)) translateY(0); }
      45% { transform: scaleX(var(--face,1)) translateY(-42px); }
    }
    @keyframes petArmsUp { 0%,100%{transform:rotate(-150deg)} 45%{transform:rotate(-170deg)} }
    @keyframes petKick { 0%,100%{transform:rotate(10deg)} 40%{transform:rotate(-55deg)} 55%{transform:rotate(35deg)} }
    @keyframes petBalanceArm { 0%,100%{transform:rotate(18deg)} 50%{transform:rotate(-25deg)} }
    @keyframes petSoccerLean {
      0%,100% { transform: scaleX(var(--face,1)) rotate(0deg); }
      40% { transform: scaleX(var(--face,1)) rotate(-8deg) translateX(4px); }
      55% { transform: scaleX(var(--face,1)) rotate(6deg); }
    }
    @keyframes petDance {
      0%,100% { transform: scaleX(var(--face,1)) translateY(0) rotate(-8deg); }
      50% { transform: scaleX(var(--face,1)) translateY(-18px) rotate(8deg); }
    }
    @keyframes petDanceArmL { 0%,100%{transform:rotate(40deg)} 50%{transform:rotate(-130deg)} }
    @keyframes petDanceArmR { 0%,100%{transform:rotate(-130deg)} 50%{transform:rotate(40deg)} }
    @keyframes petRunBob {
      0%,100% { transform: scaleX(var(--face,1)) translateY(0); }
      50% { transform: scaleX(var(--face,1)) translateY(-6px); }
    }
    @keyframes petBigJump {
      0%,100% { transform: scaleX(var(--face,1)) translateY(0) scale(1,1); }
      30% { transform: scaleX(var(--face,1)) translateY(6px) scale(1.05,0.9); }
      55% { transform: scaleX(var(--face,1)) translateY(-56px) scale(0.95,1.08); }
    }
    @keyframes petThrow { 0%{transform:rotate(20deg)} 45%{transform:rotate(-160deg)} 100%{transform:rotate(20deg)} }
    @keyframes petThrowLean {
      0%,100% { transform: scaleX(var(--face,1)) rotate(0); }
      45% { transform: scaleX(var(--face,1)) rotate(-12deg) translateX(6px); }
    }
    @keyframes petBikeSit {
      0%,100% { transform: scaleX(var(--face,1)) translateY(4px) rotate(-4deg); }
      50% { transform: scaleX(var(--face,1)) translateY(2px) rotate(2deg); }
    }
    @keyframes petPedalL { 0%{transform:rotate(30deg)} 50%{transform:rotate(-40deg)} 100%{transform:rotate(30deg)} }
    @keyframes petPedalR { 0%{transform:rotate(-40deg)} 50%{transform:rotate(30deg)} 100%{transform:rotate(-40deg)} }
    @keyframes ballFollowKick {
      0% { transform: translate(-10px, 30px) scale(0.7); opacity: 0; }
      20% { opacity: 1; transform: translate(8px, 34px) scale(0.9); }
      45% { transform: translate(70px, 10px) scale(1); }
      100% { transform: translate(160px, 40px) scale(0.85); opacity: 0; }
    }
    @keyframes bballFollow {
      0% { transform: translate(0, 20px) scale(0.7); opacity: 0; }
      25% { opacity: 1; transform: translate(6px, -35px) scale(0.95); }
      50% { transform: translate(10px, 25px) scale(1); }
      75% { transform: translate(14px, -40px) scale(0.95); }
      100% { transform: translate(18px, 30px) scale(0.8); opacity: 0; }
    }

    #pet.sleep .eye-l, #pet.sleep .eye-r {
      height: 3px !important; border-radius: 2px !important;
    }
    #pet.sleep .eye-l::after, #pet.sleep .eye-r::after { display: none; }

    .part { position: absolute; }
    .head {
      width: 58px; height: 52px; left: 50%; top: 8px;
      transform: translateX(-50%); border-radius: 50% 50% 46% 46%;
      z-index: 3;
    }
    .torso {
      width: 46px; height: 40px; left: 50%; top: 52px;
      transform: translateX(-50%); border-radius: 18px 18px 16px 16px;
      z-index: 2;
    }
    .arm-l, .arm-r {
      width: 14px; height: 28px; top: 56px; border-radius: 10px;
      z-index: 1; transform-origin: 50% 8%;
    }
    .arm-l { left: 18px; }
    .arm-r { right: 18px; }
    .leg-l, .leg-r {
      width: 15px; height: 26px; top: 88px; border-radius: 10px;
      z-index: 1; transform-origin: 50% 10%;
    }
    .leg-l { left: 34px; }
    .leg-r { right: 34px; }
    .foot {
      position: absolute; left: 50%; bottom: -3px; width: 18px; height: 8px;
      transform: translateX(-50%); border-radius: 8px;
    }
    .eye-l, .eye-r {
      position: absolute; width: 10px; height: 12px; background: #1e1b4b;
      border-radius: 50%; top: 22px; animation: blink 5s infinite; z-index: 4;
    }
    .eye-l { left: 14px; }
    .eye-r { right: 14px; }
    .eye-l::after, .eye-r::after {
      content: ""; position: absolute; width: 3px; height: 3px;
      background: #fff; border-radius: 50%; top: 2px; left: 2px;
    }
    .blush-l, .blush-r {
      position: absolute; width: 10px; height: 6px; top: 30px;
      background: rgba(244,114,182,0.45); border-radius: 50%; filter: blur(0.5px);
    }
    .blush-l { left: 6px; }
    .blush-r { right: 6px; }
    .mouth {
      position: absolute; width: 12px; height: 7px; left: 50%; top: 34px;
      transform: translateX(-50%); border: 2px solid #312e81;
      border-top: 0; border-radius: 0 0 12px 12px;
    }
    .ear-l, .ear-r {
      position: absolute; z-index: 0;
    }
    .tail {
      position: absolute; z-index: 0; transform-origin: left center;
    }


    /* Wearables (hat / clothes / glasses) */
    .wear { pointer-events: none; }
    .wear[hidden] { display: none !important; }
    .wear-hat {
      position: absolute; left: 50%; top: -10px; z-index: 6;
      width: 52px; height: 28px; transform: translateX(-50%);
    }
    .wear-hat::before {
      content: ""; position: absolute; left: 50%; bottom: 6px;
      width: 34px; height: 20px; transform: translateX(-50%);
      background: var(--wear-hat, #ef4444);
      border-radius: 14px 14px 6px 6px;
      box-shadow: inset 0 -3px 0 rgba(0,0,0,0.12);
    }
    .wear-hat::after {
      content: ""; position: absolute; left: 50%; bottom: 2px;
      width: 52px; height: 10px; transform: translateX(-50%);
      background: var(--wear-hat, #ef4444);
      border-radius: 999px;
      box-shadow: 0 2px 0 rgba(0,0,0,0.12);
    }
    .wear-clothes {
      position: absolute; left: 50%; top: 2px; z-index: 5;
      width: 42px; height: 34px; transform: translateX(-50%);
      background: var(--wear-clothes, #3b82f6);
      border-radius: 12px 12px 10px 10px;
      box-shadow: inset 0 -4px 0 rgba(0,0,0,0.12);
    }
    .wear-clothes::before {
      content: ""; position: absolute; left: 50%; top: 8px;
      width: 8px; height: 8px; transform: translateX(-50%);
      background: rgba(255,255,255,0.55); border-radius: 50%;
    }
    .wear-glasses {
      position: absolute; left: 50%; top: 20px; z-index: 7;
      width: 44px; height: 14px; transform: translateX(-50%);
    }
    .wear-glasses::before, .wear-glasses::after {
      content: ""; position: absolute; top: 0;
      width: 16px; height: 14px;
      border: 2.5px solid var(--wear-glasses, #1e293b);
      border-radius: 6px; background: rgba(255,255,255,0.12);
      box-sizing: border-box;
    }
    .wear-glasses::before { left: 2px; }
    .wear-glasses::after { right: 2px; }
    .head .wear-glasses {
      /* bridge */
    }
    .wear-glasses {
      background: linear-gradient(90deg,
        transparent 0, transparent 42%,
        var(--wear-glasses, #1e293b) 42%, var(--wear-glasses, #1e293b) 58%,
        transparent 58%);
      background-size: 100% 2.5px; background-repeat: no-repeat; background-position: center 5px;
    }

    /* Skins */
    .skin-cat .head, .skin-cat .torso, .skin-cat .arm-l, .skin-cat .arm-r,
    .skin-cat .leg-l, .skin-cat .leg-r, .skin-cat .foot {
      background: linear-gradient(160deg, #fdba74, #fb923c);
    }
    .skin-cat .ear-l, .skin-cat .ear-r {
      width: 0; height: 0; top: -2px; border-left: 10px solid transparent;
      border-right: 10px solid transparent; border-bottom: 18px solid #fb923c;
    }
    .skin-cat .ear-l { left: 6px; transform: rotate(-12deg); }
    .skin-cat .ear-r { right: 6px; transform: rotate(12deg); }
    .skin-cat .ear-l::after, .skin-cat .ear-r::after {
      content: ""; position: absolute; left: -5px; top: 6px;
      border-left: 5px solid transparent; border-right: 5px solid transparent;
      border-bottom: 10px solid #fecdd3;
    }
    .skin-cat .tail {
      width: 34px; height: 10px; right: -8px; top: 70px;
      background: #fb923c; border-radius: 10px;
      animation: tail 1.2s ease-in-out infinite;
    }

    .skin-dog .head, .skin-dog .torso, .skin-dog .arm-l, .skin-dog .arm-r,
    .skin-dog .leg-l, .skin-dog .leg-r, .skin-dog .foot {
      background: linear-gradient(160deg, #fde68a, #f59e0b);
    }
    .skin-dog .ear-l, .skin-dog .ear-r {
      width: 16px; height: 24px; top: 10px; background: #d97706; border-radius: 12px;
    }
    .skin-dog .ear-l { left: -2px; transform: rotate(18deg); }
    .skin-dog .ear-r { right: -2px; transform: rotate(-18deg); }
    .skin-dog .tail {
      width: 28px; height: 12px; right: -4px; top: 68px;
      background: #f59e0b; border-radius: 12px 12px 8px 8px;
      animation: wag 0.35s ease-in-out infinite;
    }

    .skin-bunny .head, .skin-bunny .torso, .skin-bunny .arm-l, .skin-bunny .arm-r,
    .skin-bunny .leg-l, .skin-bunny .leg-r, .skin-bunny .foot {
      background: linear-gradient(160deg, #fbcfe8, #f9a8d4);
    }
    .skin-bunny .ear-l, .skin-bunny .ear-r {
      width: 14px; height: 36px; top: -22px; background: #f9a8d4; border-radius: 12px;
    }
    .skin-bunny .ear-l { left: 10px; transform: rotate(-8deg); }
    .skin-bunny .ear-r { right: 10px; transform: rotate(8deg); }
    .skin-bunny .ear-l::after, .skin-bunny .ear-r::after {
      content: ""; position: absolute; inset: 8px 4px 6px; background: #fecdd3; border-radius: 10px;
    }
    .skin-bunny .tail {
      width: 16px; height: 16px; right: 8px; top: 78px;
      background: #fff; border-radius: 50%; box-shadow: 0 0 0 2px #f9a8d4 inset;
    }

    .skin-fox .head, .skin-fox .torso, .skin-fox .arm-l, .skin-fox .arm-r,
    .skin-fox .leg-l, .skin-fox .leg-r, .skin-fox .foot {
      background: linear-gradient(160deg, #fdba74, #ea580c);
    }

  <script>
    const FORMS = [
      { id: 'cat', name: '小猫', emoji: '🐱' },
      { id: 'dog', name: '小狗', emoji: '🐶' },
      { id: 'bunny', name: '兔子', emoji: '🐰' },

    const canvas = document.getElementById('fx');

    let w = 0, h = 0, particles = [], mouse = { x: 0, y: 0 }, t = 0;

    let currentAudio = null;


    // ===== Growth V1: Level + XP (hidden; localStorage + cookie) =====
    const GROWTH_KEY = 'petworld-growth-v1';
    const GROWTH_COOKIE = 'petworld_growth_v1';
    const GROWTH_MAX_LEVEL = 20;
    const GROWTH_DAILY_CAP = 50;
    const GROWTH_COOKIE_DAYS = 400;

    function xpNeededFor(level) {
      // Lv1->2 needs 20, then +10 each level
      return 20 + Math.max(0, level - 1) * 10;
    }

    function todayKey() {
      const d = new Date();
      return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    }

    function defaultGrowth() {
      return {
        level: 1,
        xp: 0,
        totalXp: 0,
        day: todayKey(),
        gainedToday: 0,
        lastAwardAt: {}, // key -> ts
        heardWords: {},  // wordId -> count today-ish total listen
        dailyEnglishDay: '',
      };
    }

    function growthScore(g) {
      if (!g || typeof g !== 'object') return -1;
      const total = Number(g.totalXp) || 0;
      const level = Number(g.level) || 0;
      const xp = Number(g.xp) || 0;
      return total * 100000 + level * 1000 + xp;
    }

    function normalizeGrowth(raw) {
      const g = Object.assign(defaultGrowth(), raw && typeof raw === 'object' ? raw : {});
      g.level = Math.max(1, Math.min(GROWTH_MAX_LEVEL, Number(g.level) || 1));
      g.xp = Math.max(0, Number(g.xp) || 0);
      g.totalXp = Math.max(0, Number(g.totalXp) || 0);
      g.gainedToday = Math.max(0, Number(g.gainedToday) || 0);
      if (!g.lastAwardAt || typeof g.lastAwardAt !== 'object') g.lastAwardAt = {};
      if (!g.heardWords || typeof g.heardWords !== 'object') g.heardWords = {};
      return g;
    }

    function readGrowthLocal() {
      try {
        const raw = localStorage.getItem(GROWTH_KEY);
        if (!raw) return null;
        return normalizeGrowth(JSON.parse(raw));
      } catch (e) { return null; }
    }

    function readGrowthCookie() {
      try {
        const m = document.cookie.match(/(?:^|; )petworld_growth_v1=([^;]*)/);
        if (!m) return null;
        return normalizeGrowth(JSON.parse(decodeURIComponent(m[1])));
      } catch (e) { return null; }
    }

    function writeGrowthLocal(g) {
      try { localStorage.setItem(GROWTH_KEY, JSON.stringify(g)); } catch (e) {}
    }

    function writeGrowthCookie(g) {
      try {
        // Cookie = compact backup only (never store lastAwardAt / heardWords)
        const payload = JSON.stringify({
          level: g.level,
          xp: g.xp,
          totalXp: g.totalXp,
          day: g.day,
          gainedToday: g.gainedToday,
          dailyEnglishDay: g.dailyEnglishDay || '',
        });
        const maxAge = GROWTH_COOKIE_DAYS * 86400;
        document.cookie = GROWTH_COOKIE + '=' + encodeURIComponent(payload)
          + '; path=/; max-age=' + maxAge + '; SameSite=Lax';
      } catch (e) {}
    }

    function mergeGrowthStores(localG, cookieG) {
      // localStorage = full source of truth for cooldowns / heardWords.
      // Progress fields: take max totalXp/level from the two.
      const L = localG ? normalizeGrowth(localG) : null;
      const C = cookieG ? normalizeGrowth(cookieG) : null;
      if (!L && !C) return defaultGrowth();
      if (!L) return normalizeGrowth(C);
      if (!C) return normalizeGrowth(L);
      const out = Object.assign(defaultGrowth(), L);
      out.lastAwardAt = L.lastAwardAt || {};
      out.heardWords = L.heardWords || {};
      if (C.totalXp > L.totalXp || (C.totalXp === L.totalXp && C.level > L.level)) {
        out.level = Math.max(L.level, C.level);
        out.xp = C.xp;
        out.totalXp = Math.max(L.totalXp, C.totalXp);
        out.day = C.day;
        out.gainedToday = C.gainedToday;
        out.dailyEnglishDay = C.dailyEnglishDay || '';
      } else {
        out.level = Math.max(L.level, C.level);
        out.totalXp = Math.max(L.totalXp, C.totalXp);
      }
      return normalizeGrowth(out);
    }

    function applyTodayReset(g) {
      if (g.day !== todayKey()) {
        g.day = todayKey();
        g.gainedToday = 0;
        g.heardWords = {};
      }
      return g;
    }

    let GROWTH = applyTodayReset(mergeGrowthStores(readGrowthLocal(), readGrowthCookie()));
    writeGrowthLocal(GROWTH);
    writeGrowthCookie(GROWTH);

    function saveGrowth() {
      // Re-merge progress vs cookie backup, but never wipe local cooldowns
      const cookieG = readGrowthCookie();
      if (cookieG && growthScore(cookieG) > growthScore(GROWTH)) {
        GROWTH.level = Math.max(GROWTH.level, cookieG.level);
        if (cookieG.totalXp > GROWTH.totalXp) {
          GROWTH.totalXp = cookieG.totalXp;
          GROWTH.xp = cookieG.xp;
          GROWTH.day = cookieG.day;
          GROWTH.gainedToday = cookieG.gainedToday;
          GROWTH.dailyEnglishDay = cookieG.dailyEnglishDay || GROWTH.dailyEnglishDay;
        }
      }
      applyTodayReset(GROWTH);
      writeGrowthLocal(GROWTH);
      writeGrowthCookie(GROWTH);
      syncHiddenGrowthAttrs();
    }

    function syncHiddenGrowthAttrs() {
      const root = document.documentElement;
      root.dataset.petLevel = String(GROWTH.level);
      root.dataset.petXp = String(GROWTH.xp);
      root.dataset.petTotalXp = String(GROWTH.totalXp);
      root.dataset.petGainedToday = String(GROWTH.gainedToday);
    }

    function petScaleForLevel(level) {
      // Lv1 = 1.0, Lv20 ~= 1.532
      const lv = Math.min(Math.max(level, 1), GROWTH_MAX_LEVEL);
      return 1 + (lv - 1) * 0.028;
    }

    function applyPetGrowthScale() {
      if (!pet) return;
      const s = petScaleForLevel(GROWTH.level);
      pet.style.setProperty('--grow', String(s));
    }

    function renderGrowth() {
      syncHiddenGrowthAttrs();
      applyPetGrowthScale();
      const lv = document.getElementById('growthLv');
      if (lv) lv.textContent = '❤️ ' + GROWTH.level;
    }

    function growthPopup(text, { levelUp = false } = {}) {
      if (!levelUp || !text) return;
      const el = document.createElement('div');
      el.className = 'growth-pop';
      el.textContent = text;
      el.style.left = (state.x || innerWidth / 2) + 'px';
      el.style.top = ((state.y || innerHeight / 2) - 100) + 'px';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 1300);
    }

    renderGrowth();

    function noteDailyFirstEnglish() {
      if (GROWTH.day !== todayKey()) {
        GROWTH.day = todayKey();
        GROWTH.gainedToday = 0;
        GROWTH.heardWords = {};
      }
      if (GROWTH.dailyEnglishDay === todayKey()) return;
      GROWTH.dailyEnglishDay = todayKey();
      saveGrowth();
      awardXp(8, 'daily-english', { key: 'daily-english:' + todayKey(), cooldownMs: 0 });
    }

    function awardXp(amount, reason, opts = {}) {
      const now = Date.now();
      const key = opts.key || reason || 'x';
      const cooldown = opts.cooldownMs != null ? opts.cooldownMs : 8000;
      if (cooldown > 0) {
        const last = GROWTH.lastAwardAt[key] || 0;
        if (now - last < cooldown) return 0;
      }
      if (GROWTH.day !== todayKey()) {
        GROWTH.day = todayKey();
        GROWTH.gainedToday = 0;
        GROWTH.heardWords = {};
      }
      if (GROWTH.gainedToday >= GROWTH_DAILY_CAP) return 0;
      let gain = Math.max(0, amount|0);
      gain = Math.min(gain, GROWTH_DAILY_CAP - GROWTH.gainedToday);
      if (gain <= 0) return 0;

      GROWTH.lastAwardAt[key] = now;
      GROWTH.gainedToday += gain;
      GROWTH.totalXp += gain;
      GROWTH.xp += gain;

      let leveled = 0;
      while (GROWTH.level < GROWTH_MAX_LEVEL && GROWTH.xp >= xpNeededFor(GROWTH.level)) {
        GROWTH.xp -= xpNeededFor(GROWTH.level);
        GROWTH.level += 1;
        leveled += 1;
      }
      if (GROWTH.level >= GROWTH_MAX_LEVEL) GROWTH.xp = 0;

      saveGrowth();
      renderGrowth();
      if (leveled) growthPopup('爱心 +1！❤️ ' + GROWTH.level, { levelUp: true });
      if (leveled) {
        hearts(4);
        burst(['⭐', '✨', '🎉'], state.x || innerWidth/2, (state.y || innerHeight/2) - 80);
        say('更喜欢你了！', 2400);
      }
      return gain;
    }




    // Local audio cache (Cache API)
    const AUDIO_CACHE = 'petworld-audio-v1';
    const audioUrlMemo = new Map();

    async function listAllAudioPaths() {
      const paths = new Set();
      const add = (u) => { if (u && typeof u === 'string') paths.add(u.replace(/^\.\//, '')); };
      try {
        const [words, actions, dialogs, foods, plays, animals] = await Promise.all([
          fetch('words.json').then((r) => r.json()),
          fetch('actions.json').then((r) => r.json()),
          fetch('dialogs.json').then((r) => r.json()),
          fetch('foods.json').then((r) => r.json()),
          fetch('plays.json').then((r) => r.json()).catch(() => null),
          fetch('animals.json').then((r) => r.json()).catch(() => null),
        ]);
        (words.items || []).forEach((it) => { add(it.audio); add(it.phonicsAudio); });
        Object.values(actions.actions || {}).forEach((arr) => arr.forEach((it) => add(it.audio)));
        (dialogs.dialogs || []).forEach((it) => add(it.audio));
        (foods.foods || []).forEach((it) => {
          if (it.accept) add(it.accept.audio);
          if (it.reject) add(it.reject.audio);
        });
        if (foods.genericAccept) add(foods.genericAccept.audio);
        if (foods.genericReject) add(foods.genericReject.audio);
        if (foods.askFood) add(foods.askFood.audio);
        add('audio/good_morning.mp3');
        const playsSrc = plays || PLAYS;
        if (playsSrc && playsSrc.plays) {
          playsSrc.plays.forEach((p) => add(p.audio));
          if (playsSrc.generic) add(playsSrc.generic.audio);
        }
        const animalsSrc = animals || ANIMALS;
        if (animalsSrc && animalsSrc.animals) {
          animalsSrc.animals.forEach((a) => add(a.audio));
        }
      } catch (e) {
        console.warn('list audio failed', e);
      }
      return [...paths];
    }

    const AUDIO_MEMO_CAP = 80;

    function rememberAudioUrl(path, url) {
      if (audioUrlMemo.has(path)) {
        const old = audioUrlMemo.get(path);
        if (old && old !== url && String(old).startsWith('blob:')) {
          try { URL.revokeObjectURL(old); } catch (e) {}
        }
      }
      audioUrlMemo.set(path, url);
      while (audioUrlMemo.size > AUDIO_MEMO_CAP) {
        const first = audioUrlMemo.keys().next().value;
        const old = audioUrlMemo.get(first);
        audioUrlMemo.delete(first);
        if (old && String(old).startsWith('blob:')) {
          try { URL.revokeObjectURL(old); } catch (e) {}
        }
      }
    }

    async function getPlayableUrl(path) {
      if (!path) return path;
      if (audioUrlMemo.has(path)) return audioUrlMemo.get(path);
      try {
        if (window.caches) {
          const cache = await caches.open(AUDIO_CACHE);
          const req = new Request(path, { cache: 'reload' });
          let res = await cache.match(path);
          if (!res) res = await cache.match(req);
          if (res) {
            const blob = await res.blob();
            const url = URL.createObjectURL(blob);
            rememberAudioUrl(path, url);
            return url;
          }
        }
      } catch (e) {}
      return path;
    }

    async function playCachedAudio(path, { rate = 1 } = {}) {
      const url = await getPlayableUrl(path);
      if (currentAudio) { currentAudio.pause(); currentAudio = null; }
      const audio = new Audio(url);
      audio.playbackRate = rate;
      currentAudio = audio;
      try { await audio.play(); } catch (e) {}
      return audio;
    }

    let preloadAbort = null;
    async function preloadAllAudio() {
      const btn = document.getElementById('preloadBtn');
      if (!btn) return;
      if (btn.classList.contains('busy') && preloadAbort) {
        preloadAbort.abort();
        preloadAbort = null;
        btn.classList.remove('busy');
        btn.textContent = '已取消 · 点击重试';
        say('预下载已取消', 1800);
        return;
      }
      if (btn.classList.contains('busy')) return;
      if (!window.caches) {
        say('当前浏览器不支持缓存', 2400);
        btn.textContent = '不支持缓存 · 点击重试';
        return;
      }
      const ac = new AbortController();
      preloadAbort = ac;
      btn.classList.add('busy');
      btn.classList.remove('done');
      const paths = await listAllAudioPaths();
      const cache = await caches.open(AUDIO_CACHE);
      let done = 0, fail = 0;
      const total = paths.length;
      btn.textContent = `下载中 0/${total} · 点此取消`;
      for (const path of paths) {
        if (ac.signal.aborted) break;
        try {
          const hit = await cache.match(path);
          if (!hit) {
            const res = await fetch(path, { cache: 'reload', signal: ac.signal });
            if (!res.ok) throw new Error('bad status');
            await cache.put(path, res.clone());
          }
          done += 1;
        } catch (e) {
          if (e && (e.name === 'AbortError' || ac.signal.aborted)) break;
          fail += 1;
        }
        if (!ac.signal.aborted) btn.textContent = `下载中 ${done + fail}/${total} · 点此取消`;
      }
      if (ac.signal.aborted) {
        if (preloadAbort === ac) preloadAbort = null;
        return;
      }
      preloadAbort = null;
      btn.classList.remove('busy');
      if (fail) {
        btn.classList.remove('done');
        btn.textContent = `失败 ${fail} · 已缓存 ${done}/${total} · 点此重试`;
        say('部分音频缓存失败，可点击重试', 2400);
      } else {
        btn.classList.add('done');
        btn.textContent = `已缓存 ${done}`;
        say('音频已预下载到本地', 2200);
        localStorage.setItem('proto-audio-preloaded', '1');
      }
    }

    async function refreshPreloadButton() {
      const btn = document.getElementById('preloadBtn');
      if (!btn || !window.caches) return;
      try {
        const paths = await listAllAudioPaths();
        const cache = await caches.open(AUDIO_CACHE);
        let n = 0;
        for (const path of paths) {
          if (await cache.match(path)) n += 1;
        }
        if (n >= paths.length && paths.length) {
          btn.classList.add('done');
          btn.textContent = `已缓存 ${n}`;
        } else if (n > 0) {
          btn.textContent = `预下载音频 ${n}/${paths.length}`;
        }
      } catch (e) {}
    }



    const state = {
      x: innerWidth * 0.7,
      y: innerHeight * 0.72,

      vy: 0,
      facing: 1,
      mode: 'wander', // wander | follow | sleep

      document.body.classList.remove('env-cat','env-dog','env-bunny','env-fox','env-panda');
      document.body.classList.add('env-' + id);
      const themes = {
        cat: ['🌳', '🧶', '🏠', '🌿'],
        dog: ['🌳', '🎾', '🏡', '🌼'],
        bunny: ['🌳', '🌸', '🥕', '🌿'],
        fox: ['🌲', '🍂', '🍄', '🌿'],
        panda: ['🎋', '🐼', '🍃', '🌸']
      };
      const t = themes[id] || themes.cat;
      const ids = ['decor1','decor2','decor3','decor4'];
      ids.forEach((nid, i) => {
        const el = document.getElementById(nid);
        if (el) el.textContent = t[i];
      });
    }

    function setForm(id, opts = {}) {
      state.form = id;
      if (typeof clearPetPlayPose === 'function') clearPetPlayPose();
      buildFigure(id);
      applyEnv(id);
      renderPicker();
      if (typeof applyPetGrowthScale === 'function') applyPetGrowthScale();
      if (typeof applyOutfit === 'function') applyOutfit();
      if (!opts.silent) say(FORMS.find((f) => f.id === id).name + '登场！');
      localStorage.setItem('proto-pet-form', id);
    }

    function say(text, ms = 1400) {
      bubble.textContent = text;
      bubble.classList.add('show');
      clearTimeout(say._t);
      say._t = setTimeout(() => bubble.classList.remove('show'), ms);
    }


    function spawnProp(emoji, cls, x, y, ms = 3200) {
      const el = document.createElement('div');
      el.className = 'fx-prop ' + cls;
      el.textContent = emoji;
      el.style.left = x + 'px';
      el.style.top = y + 'px';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), ms);
      return el;
    }

    function burst(emojis, x, y) {
      emojis.forEach((e, i) => {
        const el = document.createElement('div');
        el.className = 'fx-burst';
        el.textContent = e;
        const ang = (Math.PI * 2 * i) / emojis.length;
        el.style.left = x + 'px';
        el.style.top = y + 'px';
        el.style.setProperty('--dx', Math.cos(ang) * 56 + 'px');
        el.style.setProperty('--dy', Math.sin(ang) * 40 - 20 + 'px');
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 1800);
      });
    }

    function actionVisual(kind) {
      const x = state.x;
      const y = state.y - 70;
      if (kind === 'play' || kind === 'lets_play') {
        startPlay(null);
        return;
      } else if (kind === 'feed' || kind === 'hungry' || kind === 'i_am_hungry') {
        const foods = { cat: '🐟', dog: '🦴', bunny: '🥕', fox: '🍗', panda: '🎋' };
        const food = foods[state.form] || '🍎';
        spawnProp(food, 'food', x, y - 10, 3000);
        setTimeout(() => burst(['😋', '✨', '💖'], x, y), 1000);
        setHappy(2400);
      } else if (kind === 'sleep' || kind === 'good_night' || kind === 'i_am_sleepy') {
        spawnProp('Z', 'zzz', x + 24, y - 10, 4400);
        setTimeout(() => spawnProp('z', 'zzz', x + 40, y - 24, 4000), 560);
        setTimeout(() => spawnProp('💤', 'zzz', x + 18, y - 36, 4000), 1120);
      } else if (kind === 'pet' || kind === 'love' || kind === 'i_love_you') {
        spawnProp('🤚', 'pethand', x - 10, y - 8, 2400);
        hearts(5);
        burst(['💗', '✨', '💞'], x, y);
      }
    }

    function hearts(n = 3) {
      for (let i = 0; i < n; i++) {
        const el = document.createElement('div');
        el.className = 'heart';
        el.textContent = ['💗','✨','💜'][i % 3];
        el.style.left = state.x + (Math.random() * 40 - 20) + 'px';
        el.style.top = state.y - 90 + 'px';
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 1800);
      }
    }


    function holdStill(ms = 3600) {
      const now = performance.now();
      if (!state.holdUntil || now >= state.holdUntil) {
        state.holdPrevMode = state.mode === 'follow' ? 'wander' : state.mode;
      }
      // freeze in place; keep sleep if already sleeping
      if (state.mode !== 'sleep') state.mode = 'hold';
      state.vx = 0;
      state.vy = 0;
      state.holdUntil = now + ms;

    const OUTFIT_KEY = 'petworld-outfit-v1';
    const WEAR_COLORS = {
      red: '#ef4444', yellow: '#facc15', blue: '#3b82f6', green: '#22c55e',
      pink: '#f472b6', purple: '#a78bfa', orange: '#fb923c', white: '#f8fafc', black: '#1e293b'
    };
    const WEAR_COLOR_IDS = Object.keys(WEAR_COLORS);
    const WEAR_COLOR_ALIASES = {
      red: ['red'],
      yellow: ['yellow'],
      blue: ['blue'],
      green: ['green'],
      pink: ['pink'],
      purple: ['purple'],
      orange: ['orange'],
      white: ['white'],
      black: ['black']
    };
    const WEAR_SLOT_ALIASES = {
      hat: ['hat', 'cap'],
      clothes: ['clothes', 'shirt'],
      glasses: ['glasses', 'sunglasses']
    };
    const WEAR_DEFAULTS = { hat: 'red', clothes: 'blue', glasses: 'black' };
    let OUTFIT = { hat: null, clothes: null, glasses: null };
    let lastWearSlot = null;

    function loadOutfit() {
      try {
        const raw = localStorage.getItem(OUTFIT_KEY);
        if (raw) {
          const o = JSON.parse(raw);
          OUTFIT = {
            hat: o.hat && o.hat.color ? { color: o.hat.color } : null,
            clothes: o.clothes && o.clothes.color ? { color: o.clothes.color } : null,
            glasses: o.glasses && o.glasses.color ? { color: o.glasses.color } : null
          };
        }
      } catch (e) {}
      return OUTFIT;

    function saveOutfit() {

    function applyOutfit() {
      if (!figure) return;
      const map = {
        hat: figure.querySelector('.wear-hat'),
        clothes: figure.querySelector('.wear-clothes'),
        glasses: figure.querySelector('.wear-glasses')

      for (const slot of ['hat', 'clothes', 'glasses']) {
        const node = map[slot];

        const piece = OUTFIT[slot];
        if (!piece || !piece.color) {
          node.hidden = true;
          continue;
        }
        const hex = WEAR_COLORS[piece.color] || piece.color;
        node.hidden = false;
        const varName = slot === 'hat' ? '--wear-hat' : (slot === 'clothes' ? '--wear-clothes' : '--wear-glasses');
        node.style.setProperty(varName, hex);

    function wearPiece(slot, colorId) {
      if (!WEAR_SLOT_ALIASES[slot]) return;
      const c = WEAR_COLORS[colorId] ? colorId : (WEAR_DEFAULTS[slot] || 'red');
      OUTFIT[slot] = { color: c };

    function removePiece(slot) {

        OUTFIT = { hat: null, clothes: null, glasses: null };

        OUTFIT[slot] = null;
      } else {
        return;

      applyOutfit();
      if (typeof awardXp === 'function') awardXp(1, 'outfit-off', { key: 'outfit-off:' + slot, cooldownMs: 6000 });
    }
    function cycleWearSlot(slot) {
      const order = [null].concat(WEAR_COLOR_IDS);
      const cur = OUTFIT[slot] && OUTFIT[slot].color;
      let idx = order.indexOf(cur);
      if (idx < 0) idx = 0;
      const next = order[(idx + 1) % order.length];
      if (next == null) {
        removePiece(slot);
        say('OK, no ' + slot + '.', 1600);

        wearPiece(slot, next);

    function matchTrigger(text, trigger) {
      const t = (text || '').toLowerCase().trim();
      const g = String(trigger || '').toLowerCase().trim();
      if (!t || !g) return false;
      if (/[\u4e00-\u9fff]/.test(g)) return t.includes(g);
      // escape regex specials then word-boundary-ish for EN
      const esc = g.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      return new RegExp('(^|[^a-z0-9])' + esc + '([^a-z0-9]|$)').test(t);
    }

    function detectWearColor(text) {
      const t = (text || '').toLowerCase();
      let best = null, bestLen = 0;
      for (const [id, aliases] of Object.entries(WEAR_COLOR_ALIASES)) {
        for (const a of aliases) {
          if (matchTrigger(t, a) && a.length >= bestLen) { best = id; bestLen = a.length; }
        }
      }
      return best;
    }
    function detectWearSlot(text) {
      const t = (text || '').toLowerCase();
      let best = null, bestLen = 0;
      for (const [slot, aliases] of Object.entries(WEAR_SLOT_ALIASES)) {
        for (const a of aliases) {
          if (matchTrigger(t, a) && a.length >= bestLen) { best = slot; bestLen = a.length; }
        }
      }
      return best;
    }
    function maybeHandleOutfitCommand(text) {
      const t = (text || '').toLowerCase().trim();
      if (!t) return false;
      const naked = /naked|no outfit/.test(t);
      if (naked) {
        removePiece('all');
        say('OK, no outfit.', 1600);
        return true;
      }
      const slot = detectWearSlot(t);
      const isRemove = /no\s+(hat|cap|clothes|shirt|glasses|sunglasses)/.test(t)
        || /take\s+off/.test(t)
        || (matchTrigger(t, 'no') && !!slot);
      if (isRemove && (slot || /take\s+off/.test(t) || matchTrigger(t, 'no'))) {
        if (slot) {
          removePiece(slot);
          say('OK, no ' + slot + '.', 1600);
          return true;
        }
        if (lastWearSlot) {
          removePiece(lastWearSlot);
          say('OK, no ' + lastWearSlot + '.', 1600);
          return true;
        }
        if (/naked|no outfit/.test(t)) {
          removePiece('all');
          say('OK, no outfit.', 1600);
          return true;
        }
      }
      if (!slot) return false;
      const color = detectWearColor(t);
      const wearIntent = /wear|put on/.test(t) || !!color
        || /hat|cap|clothes|shirt|glasses|sunglasses/.test(t);
      if (!wearIntent) return false;
      const useColor = color || WEAR_DEFAULTS[slot] || 'red';
      wearPiece(slot, useColor);
      say('Nice ' + useColor + ' ' + slot + '!', 1600);
      return true;
    }


    function findPlay(text) {
      if (!PLAYS || !PLAYS.plays) return null;
      const t = (text || '').toLowerCase().trim();
      if (!t) return null;
      let best = null, bestLen = 0;
      for (const p of PLAYS.plays) {
        for (const trig of p.triggers) {
          const g = String(trig).toLowerCase();
          if (matchTrigger(t, g) && g.length >= bestLen) {
            best = p; bestLen = g.length;
          }
        }
      }
      return best;
    }

    function maybeHandleAnimalCommand(text) {

      const explicit = /\b(i am|i'm|im|be|become|change to|switch to|turn into)\b/.test(t);
      const bare = t === animal.name || t === animal.id || animal.triggers.some((g) => t === String(g).toLowerCase());
      // Also allow "cat please" / just "cat"
      const shortAnimal = animal.triggers.some((g) => {
        const gg = String(g).toLowerCase();
        return t === gg || t === `${gg}s` || t.startsWith(gg + ' ') || t.endsWith(' ' + gg);

      if (explicit || bare || shortAnimal) {

        return true;

      const t = (text || '').toLowerCase().trim();

      let best = null;
      let bestLen = 0;
      for (const d of DIALOGS.dialogs) {
        if (d.id === 'fallback') continue;
        for (const trig of d.triggers) {
          const g = String(trig).toLowerCase();
          if (matchTrigger(t, g) && g.length >= bestLen) {
            best = d;
            bestLen = g.length;
          }
        }
      }
      return best || DIALOGS.dialogs.find((d) => d.id === 'fallback');
    }

      recognition.onerror = (e) => {
        recognizing = false;
        document.getElementById('micBtn').classList.remove('listening');
        document.getElementById('micBtn').textContent = '🎤';
        const msg = {
          'not-allowed': '麦克风被拒绝 / Mic blocked — 请在浏览器站点设置中允许麦克风 Allow mic in site settings',
          'service-not-allowed': '麦克风被拒绝 / Mic blocked — 请在浏览器站点设置中允许麦克风 Allow mic in site settings',
          'no-speech': '没听到说话 / No speech — 请再说一次 Try again',
          'audio-capture': '未找到麦克风 / No microphone found',
          'network': '语音识别需要网络 / Speech recognition needs network'
        }[e.error] || ('识别出错 / Error：' + e.error);
        setMicStatus(msg);
        say(e.error === 'not-allowed' || e.error === 'service-not-allowed'
          ? '请允许麦克风' : msg, 2800);
      };
      recognition.onresult = (ev) => {
        const alts = [];
        for (let i = 0; i < ev.results[0].length; i++) alts.push(ev.results[0][i].transcript);
        lastHeard = alts[0] || '';
        let actionNote = '';
        // Outfit wearables before dialog match
        let suited = false;
        for (const a of alts) {
          if (maybeHandleOutfitCommand(a)) { suited = true; actionNote = 'Outfit'; break; }
        }
        if (suited) { setMicStatus('听到：' + lastHeard + ' → ' + actionNote); return; }
        // Eat commands first: "eat apple"
        let ate = false;
        for (const a of alts) {
          if (maybeHandleEatCommand(a)) { ate = true; actionNote = 'Feed'; break; }
        }
        if (ate) { setMicStatus('听到：' + lastHeard + (actionNote ? ' → ' + actionNote : '')); return; }
        // Animal switch: "cat" / "I am a dog"
        let switched = false;
        for (const a of alts) {
          if (maybeHandleAnimalCommand(a)) { switched = true; actionNote = 'Animal'; break; }
        }
        if (switched) { setMicStatus('听到：' + lastHeard + ' → ' + actionNote); return; }
        let played = false;
        for (const a of alts) {
          if (maybeHandlePlayCommand(a)) { played = true; actionNote = 'Play'; break; }
        }
        if (played) { setMicStatus('听到：' + lastHeard + ' → ' + actionNote); return; }
        let matched = null;
        for (const a of alts) {
          matched = matchDialog(a);
          if (matched && matched.id !== 'fallback') break;
        }
        if (!matched) matched = matchDialog(lastHeard);
        if (matched && matched.id !== 'fallback') actionNote = matched.id;
        else if (matched) actionNote = 'fallback';
        setMicStatus('听到：' + lastHeard + (actionNote ? ' → ' + actionNote : ''));
        speakDialog(matched);
      };
    }

    function drawFx() {
      t += 0.016;
      ctx.clearRect(0, 0, w, h);
      ctx.strokeStyle = 'rgba(148,163,184,0.05)';
      const gap = 56;
      const ox = (mouse.x * 0.02) % gap;
      const oy = (mouse.y * 0.02) % gap;
      for (let x = -gap + ox; x < w + gap; x += gap) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
      }
      for (let y = -gap + oy; y < h + gap; y += gap) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
      }
      for (const p of particles) {
        p.x += p.vx + Math.sin(t + p.y * 0.01) * 0.15;
        p.y += p.vy + Math.cos(t + p.x * 0.01) * 0.15;
        if (p.x < -20) p.x = w + 20;
        if (p.x > w + 20) p.x = -20;
        if (p.y < -20) p.y = h + 20;
        if (p.y > h + 20) p.y = -20;
        ctx.beginPath();
        ctx.fillStyle = `hsla(${p.hue}, 90%, 70%, ${0.3 + p.z * 0.4})`;
        ctx.shadowColor = `hsla(${p.hue}, 90%, 70%, 0.7)`;
        ctx.shadowBlur = 10;
        ctx.arc(p.x, p.y, 1.2 + p.z * 2.1, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.shadowBlur = 0;
    }

    function tickPet(now) {
      if (now > state.moodUntil) pet.classList.remove('happy');

      // resume from hold if timer elapsed (safety)
      if (state.mode === 'hold' && performance.now() >= state.holdUntil) {
        state.mode = state.holdPrevMode === 'sleep' ? 'wander' : (state.holdPrevMode || 'wander');
        state.holdPrevMode = null;
        if (state.mode === 'wander') pickWanderTarget();
      }

      let tx = state.x, ty = state.y;
      if (state.mode === 'hold') {
        tx = state.x; ty = state.y;
        state.vx = 0; state.vy = 0;
      } else if (state.mode === 'follow') {
        tx = mouse.x;
        ty = mouse.y + 10;
      } else if (state.mode === 'wander') {
        if (now > state.nextWanderAt || Math.hypot(state.target.x - state.x, state.target.y - state.y) < 18) {
          pickWanderTarget();
        }
        tx = state.target.x;
        ty = state.target.y;
      }

      if (state.mode !== 'sleep' && state.mode !== 'hold') {
        const dx = tx - state.x;
        const dy = ty - state.y;
        const dist = Math.hypot(dx, dy) || 1;
        const speed = state.mode === 'follow' ? 1.6 : 0.38;
        if (dist > 8) {
          state.vx += (dx / dist) * speed * 0.35;
          state.vy += (dy / dist) * speed * 0.35;
        }
      } else {
        state.vx = 0;
        state.vy = 0;
      }

      state.vx *= 0.88;
      state.vy *= 0.88;
      state.x += state.vx;
      state.y += state.vy;
      state.x = Math.max(50, Math.min(w - 50, state.x));
      state.y = Math.max(120, Math.min(h - 30, state.y));

      const moving = Math.hypot(state.vx, state.vy) > 0.18 && state.mode !== 'sleep';
      if (!pet.classList.contains('acting')) pet.classList.toggle('walk', moving);
      else pet.classList.remove('walk');
      if (Math.abs(state.vx) > 0.08) state.facing = state.vx < 0 ? -1 : 1;

      pet.style.left = state.x + 'px';
      pet.style.top = state.y + 'px';
      pet.style.transform = `translate(-50%, -100%) scale(var(--grow, 1))`;
      // face left/right on body only, keep bubble text unmirrored
      figure.style.setProperty('--face', String(state.facing));
    }

    applyEnv(state.form);
    applyOutfit();
    applyPetGrowthScale();
    renderPicker();
    resize();
    mouse.x = state.x; mouse.y = state.y - 40;
    say('选形象，长按我会跟着你', 2400);
    loop();
  </script>
</body>
</html>
