<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#020617" />
  <title>Pet World · Display</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #020617;
      --fg: #e2e8f0;
      --accent: #a5b4fc;
      --ok: #4ade80;
      --bad: #fb7185;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%;
      background: radial-gradient(1200px 700px at 50% 0%, #1e1b4b 0%, var(--bg) 55%);
      color: var(--fg);
      font-family: ui-rounded, "Segoe UI", "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    body.display-mode { cursor: none; }
    .stage {
      min-height: 100%; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: max(24px, 4vh) 24px 32px; gap: 18px; text-align: center;
    }
    .pet {
      font-size: clamp(96px, 22vw, 220px); line-height: 1;
      filter: drop-shadow(0 18px 40px rgba(0,0,0,0.45));
      transition: transform 0.35s ease;
    }
    .pet.pulse { animation: pulse 1.2s ease; }
    @keyframes pulse {
      0% { transform: scale(1); }
      40% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }
    .name {
      font-size: clamp(18px, 3.2vw, 28px); color: rgba(226,232,240,0.7); letter-spacing: 0.04em;
    }
    .bubble {
      max-width: min(90vw, 900px);
      min-height: 1.2em;
      font-size: clamp(28px, 5.5vw, 56px);
      font-weight: 700;
      color: #f8fafc;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.25s ease, transform 0.25s ease;
      text-shadow: 0 8px 24px rgba(0,0,0,0.35);
    }
    .bubble.show { opacity: 1; transform: translateY(0); }
    .quiz {
      margin-top: 8px; width: min(92vw, 980px);
      display: none; flex-direction: column; align-items: center; gap: 10px;
    }
    .quiz.open { display: flex; }
    .quiz .word {
      font-size: clamp(56px, 14vw, 140px); font-weight: 800; letter-spacing: 0.02em;
      color: #fff; line-height: 1.05;
    }
    .quiz .ipa { font-size: clamp(20px, 3.5vw, 36px); color: var(--accent); }
    .quiz .zh { font-size: clamp(18px, 3vw, 30px); color: rgba(226,232,240,0.72); }
    .quiz .feedback {
      min-height: 1.2em; font-size: clamp(22px, 4vw, 40px); font-weight: 700;
      color: rgba(226,232,240,0.85);
    }
    .quiz .feedback.ok { color: var(--ok); }
    .quiz .feedback.bad { color: var(--bad); }
    .quiz .progress { font-size: clamp(14px, 2.2vw, 20px); color: rgba(165,180,252,0.8); }
    .learn-word {
      margin-top: 4px; display: flex; flex-direction: column; gap: 6px; align-items: center;
    }
    .learn-word .w {
      font-size: clamp(36px, 8vw, 84px); font-weight: 800; color: #e0e7ff;
    }
    .learn-word .meta { font-size: clamp(14px, 2.4vw, 22px); color: rgba(226,232,240,0.6); }
    .hud {
      position: fixed; left: 16px; top: 14px; right: 16px;
      display: flex; justify-content: space-between; gap: 12px; align-items: flex-start;
      pointer-events: none;
    }
    .badge {
      padding: 6px 12px; border-radius: 999px; font-size: 12px;
      background: rgba(15,23,42,0.65); border: 1px solid rgba(255,255,255,0.1);
      color: rgba(226,232,240,0.85); backdrop-filter: blur(8px);
    }
    .badge.warn { color: #fde68a; border-color: rgba(251,191,36,0.35); }
    .badge.ok { color: #bbf7d0; border-color: rgba(52,211,153,0.4); }
    .hint {
      position: fixed; left: 0; right: 0; bottom: 18px;
      text-align: center; font-size: 12px; color: rgba(226,232,240,0.45);
      padding: 0 16px;
    }
    .fs-btn {
      pointer-events: auto; appearance: none; border: 0; cursor: pointer;
      padding: 6px 12px; border-radius: 999px; font: inherit; font-size: 12px;
      color: #e2e8f0; background: rgba(99,102,241,0.35); border: 1px solid rgba(165,180,252,0.35);
    }
  </style>
</head>
<body>
  <div class="hud">
    <div class="badge" id="status">等待手机同步…</div>
    <button type="button" class="fs-btn" id="fsBtn" title="Fullscreen">全屏</button>
  </div>
  <div class="stage">
    <div class="pet" id="petEmoji" aria-hidden="true">🐱</div>
    <div class="name" id="petName">小猫</div>
    <div class="bubble" id="bubble">嗨～</div>
    <div class="learn-word" id="learnWord">
      <div class="w" id="word">Hello</div>
      <div class="meta"><span id="ipa">/həˈloʊ/</span> · <span id="zh">你好</span></div>
    </div>
    <div class="quiz" id="quiz">
      <div class="progress" id="quizProgress"></div>
      <div class="word" id="quizWord">Hello</div>
      <div class="ipa" id="quizIpa"></div>
      <div class="zh" id="quizZh"></div>
      <div class="feedback" id="quizFeedback"></div>
    </div>
  </div>
  <div class="hint" id="hint">在手机上打开 Pet World → 点「投屏」。若无 Cast，请用电视浏览器打开本页（备用显示，不同设备无法自动同步）。</div>

  <script>
    const CAST_CHANNEL = 'petworld-cast-v1';
    const el = {
      status: document.getElementById('status'),
      petEmoji: document.getElementById('petEmoji'),
      petName: document.getElementById('petName'),
      bubble: document.getElementById('bubble'),
      learnWord: document.getElementById('learnWord'),
      word: document.getElementById('word'),
      ipa: document.getElementById('ipa'),
      zh: document.getElementById('zh'),
      quiz: document.getElementById('quiz'),
      quizWord: document.getElementById('quizWord'),
      quizIpa: document.getElementById('quizIpa'),
      quizZh: document.getElementById('quizZh'),
      quizFeedback: document.getElementById('quizFeedback'),
      quizProgress: document.getElementById('quizProgress'),
      hint: document.getElementById('hint'),
      fsBtn: document.getElementById('fsBtn')
    };

    let lastBubble = '';
    let connected = false;

    function setStatus(text, cls) {
      el.status.textContent = text;
      el.status.className = 'badge' + (cls ? ' ' + cls : '');
    }

    function applyState(data) {
      if (!data || data.type !== 'state') return;
      connected = true;
      setStatus('已同步 · v' + (data.v || '?'), 'ok');
      if (data.emoji) el.petEmoji.textContent = data.emoji;
      if (data.name) el.petName.textContent = data.name;
      if (typeof data.bubble === 'string') {
        el.bubble.textContent = data.bubble || '';
        const show = !!data.bubbleShow && !!data.bubble;
        el.bubble.classList.toggle('show', show);
        if (show && data.bubble !== lastBubble) {
          el.petEmoji.classList.remove('pulse');
          void el.petEmoji.offsetWidth;
          el.petEmoji.classList.add('pulse');
        }
        lastBubble = data.bubble || '';
      }
      if (data.word) el.word.textContent = data.word;
      if (typeof data.ipa === 'string') el.ipa.textContent = data.ipa || '';
      if (typeof data.zh === 'string') el.zh.textContent = data.zh || '';

      const q = data.quiz || {};
      const practice = !!(q.practice && q.word);
      el.quiz.classList.toggle('open', practice);
      el.learnWord.style.display = practice ? 'none' : '';
      if (practice) {
        el.quizWord.textContent = q.word || '';
        el.quizIpa.textContent = q.ipa || '';
        el.quizZh.textContent = q.zh || '';
        el.quizProgress.textContent = q.progress || '';
        el.quizFeedback.textContent = q.feedback || '';
        const cls = String(q.feedbackClass || '');
        el.quizFeedback.className = 'feedback' + (cls.includes('ok') ? ' ok' : cls.includes('bad') ? ' bad' : '');
      }
      el.hint.style.opacity = '0.35';
    }

    function onMessageRaw(raw) {
      try {
        const data = typeof raw === 'string' ? JSON.parse(raw) : raw;
        applyState(data);
      } catch (e) {}
    }

    function attachPresentationReceiver() {
      if (!navigator.presentation || !navigator.presentation.receiver) return false;
      navigator.presentation.receiver.connectionList.then((list) => {
        const add = (connection) => {
          setStatus('Presentation 已连接', 'ok');
          connected = true;
          try {
            connection.addEventListener('message', (ev) => onMessageRaw(ev.data));
          } catch (e) {}
          try {
            connection.send(JSON.stringify({ type: 'hello', role: 'display' }));
          } catch (e) {}
        };
        (list.connections || []).forEach(add);
        list.addEventListener('connectionavailable', (ev) => add(ev.connection));
      }).catch(() => {});
      return true;
    }

    function attachBroadcast() {
      if (typeof BroadcastChannel === 'undefined') return;
      try {
        const bc = new BroadcastChannel(CAST_CHANNEL);
        bc.onmessage = (ev) => onMessageRaw(ev.data);
        setStatus(connected ? el.status.textContent : '同设备频道已就绪 · 等待手机', connected ? 'ok' : 'warn');
      } catch (e) {}
    }

    async function enterFullscreen() {
      const node = document.documentElement;
      try {
        if (!document.fullscreenElement && node.requestFullscreen) await node.requestFullscreen();
        else if (document.fullscreenElement && document.exitFullscreen) await document.exitFullscreen();
      } catch (e) {}
    }

    el.fsBtn.addEventListener('click', (e) => { e.stopPropagation(); enterFullscreen(); });
    document.addEventListener('dblclick', () => enterFullscreen());
    document.addEventListener('keydown', (e) => {
      if (e.key === 'f' || e.key === 'F') enterFullscreen();
    });

    // Auto-attempt fullscreen once on user gesture path; display=1 prefers immersive.
    const q = new URLSearchParams(location.search);
    if (q.get('display') === '1' || q.get('mode') === 'cast') {
      document.body.classList.add('display-mode');
    }

    attachPresentationReceiver();
    attachBroadcast();

    // Standalone TV browser: honest idle copy
    setTimeout(() => {
      if (!connected) {
        setStatus('独立显示页 · 等待同步（需 Cast / 同设备标签）', 'warn');
      }
    }, 2500);
  </script>
</body>
</html>
