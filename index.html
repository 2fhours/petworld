<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pet World</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body {
      display: grid;
      place-items: center;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #87c8f5;
      color: #fff;
      cursor: none;
    }
    .scene {
      position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none;
    }
    .sky {
      position: absolute; inset: 0;
      background: linear-gradient(180deg, #7ec8f8 0%, #b8e4ff 42%, #fff6d8 78%, #c8eb9c 100%);
      transition: background 0.6s ease;
    }
    .sun {
      position: absolute; top: 8%; right: 12%; width: 86px; height: 86px; border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fff7b0, #ffd35a 55%, #ffb02e 100%);
      box-shadow: 0 0 40px rgba(255, 205, 80, 0.65);
    }
    .cloud {
      position: absolute; background: rgba(255,255,255,0.92); border-radius: 40px;
      filter: drop-shadow(0 6px 10px rgba(80,120,160,0.12));
      animation: cloudMove linear infinite;
    }
    .cloud::before, .cloud::after {
      content: ""; position: absolute; background: inherit; border-radius: 50%;
    }
    .cloud.a { width: 120px; height: 40px; top: 12%; left: -20%; animation-duration: 48s; }
    .cloud.a::before { width: 50px; height: 50px; top: -24px; left: 18px; }
    .cloud.a::after { width: 66px; height: 66px; top: -30px; left: 48px; }
    .cloud.b { width: 160px; height: 46px; top: 20%; left: -30%; animation-duration: 64s; animation-delay: -20s; }
    .cloud.b::before { width: 60px; height: 60px; top: -28px; left: 26px; }
    .cloud.b::after { width: 78px; height: 78px; top: -36px; left: 66px; }
    .hill {
      position: absolute; left: -10%; right: -10%; bottom: 14%; height: 34%;
      border-radius: 50% 50% 0 0;
      background: linear-gradient(180deg, #8fd18a, #62b36b);
    }
    .hill.back {
      bottom: 18%; height: 38%; opacity: 0.75;
      background: linear-gradient(180deg, #a8db9a, #79c27a);
      transform: scaleX(1.05);
    }
    .ground {
      position: absolute; left: 0; right: 0; bottom: 0; height: 22%;
      background:
        radial-gradient(circle at 20% 30%, rgba(255,255,255,0.18), transparent 24%),
        linear-gradient(180deg, #79c45d 0%, #5aa84a 55%, #4e9440 100%);
    }
    .ground::before {
      content: ""; position: absolute; inset: 0;
      background-image: repeating-linear-gradient(90deg, transparent 0 18px, rgba(70,140,50,0.12) 18px 20px);
      opacity: 0.35;
    }
    .decor {
      position: absolute; bottom: 18%; font-size: 42px; line-height: 1;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.12));
      transition: opacity 0.35s ease, transform 0.35s ease;
    }
    .decor.d1 { left: 8%; font-size: 52px; }
    .decor.d2 { left: 22%; bottom: 20%; font-size: 34px; }
    .decor.d3 { right: 18%; bottom: 21%; font-size: 48px; }
    .decor.d4 { right: 8%; bottom: 17%; font-size: 36px; }
    @keyframes cloudMove {
      from { transform: translateX(0); }
      to { transform: translateX(140vw); }
    }
    /* pet-themed environments */
    body.env-cat .sky { background: linear-gradient(180deg, #9ad0ff 0%, #ffe3f0 55%, #d9f5b8 100%); }
    body.env-dog .sky { background: linear-gradient(180deg, #87c8f5 0%, #fff1c9 55%, #b7e38a 100%); }
    body.env-bunny .sky { background: linear-gradient(180deg, #b7e0ff 0%, #ffe8f5 50%, #d8f7c6 100%); }
    body.env-fox .sky { background: linear-gradient(180deg, #7eb6e8 0%, #ffd7a8 48%, #8fbf6e 100%); }
    body.env-panda .sky { background: linear-gradient(180deg, #8ec9a8 0%, #d7f0ff 45%, #bfe39a 100%); }
    body.env-fox .hill { background: linear-gradient(180deg, #7fba72, #4f8f4d); }
    body.env-panda .hill { background: linear-gradient(180deg, #79c98c, #4f9a62); }

    canvas#fx {
      position: fixed; inset: 0; width: 100%; height: 100%;
      z-index: 1; display: block; opacity: 0.35; mix-blend-mode: soft-light;
    }
    .aura {
      position: fixed; width: 55vmax; height: 55vmax; border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.22), transparent 65%);
      filter: blur(40px); animation: drift 12s ease-in-out infinite alternate;
      z-index: 1; pointer-events: none;
    }
    .aura.two {
      background: radial-gradient(circle, rgba(255,220,120,0.2), transparent 65%);
      animation-duration: 16s; animation-direction: alternate-reverse;
      right: -10vmax; bottom: -10vmax;
    }
    .stage {
      position: relative; z-index: 2; text-align: center;
      padding: 24px; pointer-events: none;
    }
    h1 {
      margin: 0; font-size: clamp(48px, 12vw, 96px); font-weight: 800;
      letter-spacing: 0.04em; line-height: 1.05;
      background: linear-gradient(90deg, #67e8f9, #a78bfa, #f472b6, #67e8f9);
      background-size: 300% 100%;
      -webkit-background-clip: text; background-clip: text; color: transparent;
      animation: shine 4s linear infinite, floaty 3.5s ease-in-out infinite;
      filter: drop-shadow(0 0 18px rgba(167,139,250,0.45));
    }
    .ring {
      position: absolute; inset: -28% -18%; border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 0 40px rgba(103,232,249,0.15), inset 0 0 40px rgba(167,139,250,0.08);
      animation: spin 18s linear infinite; pointer-events: none;
    }
    .ring::before, .ring::after {
      content: ""; position: absolute; width: 10px; height: 10px; border-radius: 50%;
      background: #67e8f9; box-shadow: 0 0 18px #67e8f9;
      top: 50%; left: -5px; transform: translateY(-50%);
    }
    .ring::after {
      left: auto; right: -5px; background: #f472b6; box-shadow: 0 0 18px #f472b6;
    }
    .sub {
      margin-top: 18px; font-size: 13px; letter-spacing: 0.28em;
      text-transform: uppercase; color: rgba(226,232,240,0.55);
      animation: pulse 2.4s ease-in-out infinite;
    }
    .cursor {
      position: fixed; width: 14px; height: 14px; border-radius: 50%;
      background: rgba(255,255,255,0.9);
      box-shadow: 0 0 20px rgba(167,139,250,0.9), 0 0 40px rgba(103,232,249,0.5);
      transform: translate(-50%, -50%); pointer-events: none; z-index: 9;
      mix-blend-mode: screen;
    }

    /* Character picker */
    .picker {
      position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
      z-index: 8; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
      padding: 8px; border-radius: 18px;
      background: rgba(15,23,42,0.55); border: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(10px); max-width: calc(100vw - 24px);
    }
    .picker button {
      appearance: none; border: 1px solid transparent; border-radius: 14px;
      padding: 8px 10px; min-width: 64px; font: inherit; font-size: 12px;
      color: #e2e8f0; background: rgba(255,255,255,0.05); cursor: pointer;
      transition: 0.15s ease;
    }
    .picker button.active {
      border-color: rgba(167,139,250,0.7);
      background: rgba(167,139,250,0.22);
    }
    .picker button:hover { transform: translateY(-1px); background: rgba(255,255,255,0.1); }
    .picker .emoji { display: block; font-size: 20px; line-height: 1.2; }

    .hint {
      position: fixed; top: 78px; left: 50%; transform: translateX(-50%);
      z-index: 7; font-size: 12px; color: rgba(226,232,240,0.55);
      pointer-events: none; white-space: nowrap;
    }

    /* Pet shell */
    #pet {
      position: fixed; left: 0; top: 0; width: 120px; height: 140px;
      z-index: 5; transform: translate(-50%, -100%);
      cursor: pointer; user-select: none; touch-action: none;
    }
    #pet .bubble {
      position: absolute; left: 50%; top: -6px;
      transform: translate(-50%, -100%) scale(0.92);
      background: rgba(15,23,42,0.88); border: 1px solid rgba(255,255,255,0.12);
      color: #e2e8f0; font-size: 18px; font-weight: 650; padding: 8px 14px; border-radius: 14px;
      white-space: nowrap; opacity: 0; pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
      transform-origin: 50% 100%;
    }
    #pet .bubble.show {
      opacity: 1; transform: translate(-50%, -110%) scale(1);
    }
    #pet .shadow {
      position: absolute; left: 50%; bottom: 2px; width: 58px; height: 14px;
      transform: translateX(-50%);
      background: radial-gradient(ellipse, rgba(0,0,0,0.4), transparent 70%);
      filter: blur(2px);
    }
    #pet .figure {
      position: absolute; inset: 0 8px 10px; transform-origin: 50% 100%;
    }

    /* Shared limb animation */
    #pet.walk .leg-l { animation: legL 0.55s ease-in-out infinite; }
    #pet.walk .leg-r { animation: legR 0.55s ease-in-out infinite; }
    #pet.walk .arm-l { animation: armL 0.55s ease-in-out infinite; }
    #pet.walk .arm-r { animation: armR 0.55s ease-in-out infinite; }
    #pet.walk .figure { animation: bob 0.55s ease-in-out infinite; }
    #pet.happy .figure { animation: hop 0.9s ease; }

    /* Pet body play motions */
    #pet.acting { z-index: 6; }
    #pet.acting .figure { transform-origin: 50% 100%; }
    #pet.play-swim .figure { animation: petSwim 0.7s ease-in-out infinite; }
    #pet.play-swim .arm-l { animation: petSwimArmL 0.55s ease-in-out infinite; }
    #pet.play-swim .arm-r { animation: petSwimArmR 0.55s ease-in-out infinite; }
    #pet.play-swim .leg-l, #pet.play-swim .leg-r { animation: petSwimKick 0.55s ease-in-out infinite; }
    #pet.play-basketball .figure { animation: petBallJump 0.85s ease-in-out infinite; }
    #pet.play-basketball .arm-l, #pet.play-basketball .arm-r { animation: petArmsUp 0.85s ease-in-out infinite; }
    #pet.play-soccer .leg-r { animation: petKick 0.7s ease-in-out infinite; }
    #pet.play-soccer .arm-l, #pet.play-soccer .arm-r { animation: petBalanceArm 0.7s ease-in-out infinite; }
    #pet.play-soccer .figure { animation: petSoccerLean 0.7s ease-in-out infinite; }
    #pet.play-dance .figure { animation: petDance 0.55s ease-in-out infinite; }
    #pet.play-dance .arm-l { animation: petDanceArmL 0.55s ease-in-out infinite; }
    #pet.play-dance .arm-r { animation: petDanceArmR 0.55s ease-in-out infinite; }
    #pet.play-dance .leg-l { animation: legL 0.45s ease-in-out infinite; }
    #pet.play-dance .leg-r { animation: legR 0.45s ease-in-out infinite; }
    #pet.play-run .figure { animation: petRunBob 0.28s ease-in-out infinite; }
    #pet.play-run .leg-l { animation: legL 0.28s ease-in-out infinite; }
    #pet.play-run .leg-r { animation: legR 0.28s ease-in-out infinite; }
    #pet.play-run .arm-l { animation: armL 0.28s ease-in-out infinite; }
    #pet.play-run .arm-r { animation: armR 0.28s ease-in-out infinite; }
    #pet.play-jump .figure { animation: petBigJump 0.9s ease-in-out infinite; }
    #pet.play-jump .arm-l, #pet.play-jump .arm-r { animation: petArmsUp 0.9s ease-in-out infinite; }
    #pet.play-frisbee .arm-r { animation: petThrow 0.8s ease-in-out infinite; }
    #pet.play-frisbee .figure { animation: petThrowLean 0.8s ease-in-out infinite; }
    #pet.play-bike .figure { animation: petBikeSit 0.45s ease-in-out infinite; }
    #pet.play-bike .leg-l { animation: petPedalL 0.45s linear infinite; }
    #pet.play-bike .leg-r { animation: petPedalR 0.45s linear infinite; }
    #pet.play-bike .arm-l, #pet.play-bike .arm-r { transform: rotate(-40deg); }
    .fx-prop.mini { font-size: 28px !important; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.25)); }
    .fx-prop.ball-follow { animation: ballFollowKick 3.2s ease-in-out forwards; }
    .fx-prop.bball-follow { animation: bballFollow 3.2s ease-in-out forwards; }
    .fx-prop.frisbee-follow { animation: frisbeeFly 3.2s ease-in-out forwards; font-size: 26px !important; }
    @keyframes petSwim {
      0%,100% { transform: scaleX(var(--face,1)) translate(0, 8px) rotate(-6deg); }
      50% { transform: scaleX(var(--face,1)) translate(10px, -2px) rotate(6deg); }
    }
    @keyframes petSwimArmL { 0%,100%{transform:rotate(70deg)} 50%{transform:rotate(120deg)} }
    @keyframes petSwimArmR { 0%,100%{transform:rotate(-70deg)} 50%{transform:rotate(-120deg)} }
    @keyframes petSwimKick { 0%,100%{transform:rotate(25deg)} 50%{transform:rotate(-30deg)} }
    @keyframes petBallJump {
      0%,100% { transform: scaleX(var(--face,1)) translateY(0); }
      45% { transform: scaleX(var(--face,1)) translateY(-42px); }
    }
    @keyframes petArmsUp { 0%,100%{transform:rotate(-150deg)} 45%{transform:rotate(-170deg)} }
    @keyframes petKick { 0%,100%{transform:rotate(10deg)} 40%{transform:rotate(-55deg)} 55%{transform:rotate(35deg)} }
    @keyframes petBalanceArm { 0%,100%{transform:rotate(18deg)} 50%{transform:rotate(-25deg)} }
    @keyframes petSoccerLean {
      0%,100% { transform: scaleX(var(--face,1)) rotate(0deg); }
      40% { transform: scaleX(var(--face,1)) rotate(-8deg) translateX(4px); }
      55% { transform: scaleX(var(--face,1)) rotate(6deg); }
    }
    @keyframes petDance {
      0%,100% { transform: scaleX(var(--face,1)) translateY(0) rotate(-8deg); }
      50% { transform: scaleX(var(--face,1)) translateY(-18px) rotate(8deg); }
    }
    @keyframes petDanceArmL { 0%,100%{transform:rotate(40deg)} 50%{transform:rotate(-130deg)} }
    @keyframes petDanceArmR { 0%,100%{transform:rotate(-130deg)} 50%{transform:rotate(40deg)} }
    @keyframes petRunBob {
      0%,100% { transform: scaleX(var(--face,1)) translateY(0); }
      50% { transform: scaleX(var(--face,1)) translateY(-6px); }
    }
    @keyframes petBigJump {
      0%,100% { transform: scaleX(var(--face,1)) translateY(0) scale(1,1); }
      30% { transform: scaleX(var(--face,1)) translateY(6px) scale(1.05,0.9); }
      55% { transform: scaleX(var(--face,1)) translateY(-56px) scale(0.95,1.08); }
    }
    @keyframes petThrow { 0%{transform:rotate(20deg)} 45%{transform:rotate(-160deg)} 100%{transform:rotate(20deg)} }
    @keyframes petThrowLean {
      0%,100% { transform: scaleX(var(--face,1)) rotate(0); }
      45% { transform: scaleX(var(--face,1)) rotate(-12deg) translateX(6px); }
    }
    @keyframes petBikeSit {
      0%,100% { transform: scaleX(var(--face,1)) translateY(4px) rotate(-4deg); }
      50% { transform: scaleX(var(--face,1)) translateY(2px) rotate(2deg); }
    }
    @keyframes petPedalL { 0%{transform:rotate(30deg)} 50%{transform:rotate(-40deg)} 100%{transform:rotate(30deg)} }
    @keyframes petPedalR { 0%{transform:rotate(-40deg)} 50%{transform:rotate(30deg)} 100%{transform:rotate(-40deg)} }
    @keyframes ballFollowKick {
      0% { transform: translate(-10px, 30px) scale(0.7); opacity: 0; }
      20% { opacity: 1; transform: translate(8px, 34px) scale(0.9); }
      45% { transform: translate(70px, 10px) scale(1); }
      100% { transform: translate(160px, 40px) scale(0.85); opacity: 0; }
    }
    @keyframes bballFollow {
      0% { transform: translate(0, 20px) scale(0.7); opacity: 0; }
      25% { opacity: 1; transform: translate(6px, -35px) scale(0.95); }
      50% { transform: translate(10px, 25px) scale(1); }
      75% { transform: translate(14px, -40px) scale(0.95); }
      100% { transform: translate(18px, 30px) scale(0.8); opacity: 0; }
    }

    #pet.sleep .eye-l, #pet.sleep .eye-r {
      height: 3px !important; border-radius: 2px !important;
    }
    #pet.sleep .eye-l::after, #pet.sleep .eye-r::after { display: none; }

    .part { position: absolute; }
    .head {
      width: 58px; height: 52px; left: 50%; top: 8px;
      transform: translateX(-50%); border-radius: 50% 50% 46% 46%;
      z-index: 3;
    }
    .torso {
      width: 46px; height: 40px; left: 50%; top: 52px;
      transform: translateX(-50%); border-radius: 18px 18px 16px 16px;
      z-index: 2;
    }
    .arm-l, .arm-r {
      width: 14px; height: 28px; top: 56px; border-radius: 10px;
      z-index: 1; transform-origin: 50% 8%;
    }
    .arm-l { left: 18px; }
    .arm-r { right: 18px; }
    .leg-l, .leg-r {
      width: 15px; height: 26px; top: 88px; border-radius: 10px;
      z-index: 1; transform-origin: 50% 10%;
    }
    .leg-l { left: 34px; }
    .leg-r { right: 34px; }
    .foot {
      position: absolute; left: 50%; bottom: -3px; width: 18px; height: 8px;
      transform: translateX(-50%); border-radius: 8px;
    }
    .eye-l, .eye-r {
      position: absolute; width: 10px; height: 12px; background: #1e1b4b;
      border-radius: 50%; top: 22px; animation: blink 5s infinite; z-index: 4;
    }
    .eye-l { left: 14px; }
    .eye-r { right: 14px; }
    .eye-l::after, .eye-r::after {
      content: ""; position: absolute; width: 3px; height: 3px;
      background: #fff; border-radius: 50%; top: 2px; left: 2px;
    }
    .blush-l, .blush-r {
      position: absolute; width: 10px; height: 6px; top: 30px;
      background: rgba(244,114,182,0.45); border-radius: 50%; filter: blur(0.5px);
    }
    .blush-l { left: 6px; }
    .blush-r { right: 6px; }
    .mouth {
      position: absolute; width: 12px; height: 7px; left: 50%; top: 34px;
      transform: translateX(-50%); border: 2px solid #312e81;
      border-top: 0; border-radius: 0 0 12px 12px;
    }
    .ear-l, .ear-r {
      position: absolute; z-index: 0;
    }
    .tail {
      position: absolute; z-index: 0; transform-origin: left center;
    }

    /* Skins */
    .skin-cat .head, .skin-cat .torso, .skin-cat .arm-l, .skin-cat .arm-r,
    .skin-cat .leg-l, .skin-cat .leg-r, .skin-cat .foot {
      background: linear-gradient(160deg, #fdba74, #fb923c);
    }
    .skin-cat .ear-l, .skin-cat .ear-r {
      width: 0; height: 0; top: -2px; border-left: 10px solid transparent;
      border-right: 10px solid transparent; border-bottom: 18px solid #fb923c;
    }
    .skin-cat .ear-l { left: 6px; transform: rotate(-12deg); }
    .skin-cat .ear-r { right: 6px; transform: rotate(12deg); }
    .skin-cat .ear-l::after, .skin-cat .ear-r::after {
      content: ""; position: absolute; left: -5px; top: 6px;
      border-left: 5px solid transparent; border-right: 5px solid transparent;
      border-bottom: 10px solid #fecdd3;
    }
    .skin-cat .tail {
      width: 34px; height: 10px; right: -8px; top: 70px;
      background: #fb923c; border-radius: 10px;
      animation: tail 1.2s ease-in-out infinite;
    }

    .skin-dog .head, .skin-dog .torso, .skin-dog .arm-l, .skin-dog .arm-r,
    .skin-dog .leg-l, .skin-dog .leg-r, .skin-dog .foot {
      background: linear-gradient(160deg, #fde68a, #f59e0b);
    }
    .skin-dog .ear-l, .skin-dog .ear-r {
      width: 16px; height: 24px; top: 10px; background: #d97706; border-radius: 12px;
    }
    .skin-dog .ear-l { left: -2px; transform: rotate(18deg); }
    .skin-dog .ear-r { right: -2px; transform: rotate(-18deg); }
    .skin-dog .tail {
      width: 28px; height: 12px; right: -4px; top: 68px;
      background: #f59e0b; border-radius: 12px 12px 8px 8px;
      animation: wag 0.35s ease-in-out infinite;
    }

    .skin-bunny .head, .skin-bunny .torso, .skin-bunny .arm-l, .skin-bunny .arm-r,
    .skin-bunny .leg-l, .skin-bunny .leg-r, .skin-bunny .foot {
      background: linear-gradient(160deg, #fbcfe8, #f9a8d4);
    }
    .skin-bunny .ear-l, .skin-bunny .ear-r {
      width: 14px; height: 36px; top: -22px; background: #f9a8d4; border-radius: 12px;
    }
    .skin-bunny .ear-l { left: 10px; transform: rotate(-8deg); }
    .skin-bunny .ear-r { right: 10px; transform: rotate(8deg); }
    .skin-bunny .ear-l::after, .skin-bunny .ear-r::after {
      content: ""; position: absolute; inset: 8px 4px 6px; background: #fecdd3; border-radius: 10px;
    }
    .skin-bunny .tail {
      width: 16px; height: 16px; right: 8px; top: 78px;
      background: #fff; border-radius: 50%; box-shadow: 0 0 0 2px #f9a8d4 inset;
    }

    .skin-fox .head, .skin-fox .torso, .skin-fox .arm-l, .skin-fox .arm-r,
    .skin-fox .leg-l, .skin-fox .leg-r, .skin-fox .foot {
      background: linear-gradient(160deg, #fdba74, #ea580c);
    }
    .skin-fox .ear-l, .skin-fox .ear-r {
      width: 0; height: 0; top: -4px;
      border-left: 11px solid transparent; border-right: 11px solid transparent;
      border-bottom: 20px solid #ea580c;
    }
    .skin-fox .ear-l { left: 4px; transform: rotate(-10deg); }
    .skin-fox .ear-r { right: 4px; transform: rotate(10deg); }
    .skin-fox .cheek {
      position: absolute; width: 14px; height: 12px; top: 28px;
      background: #fff; border-radius: 50%; opacity: 0.9;
    }
    .skin-fox .cheek.l { left: 2px; }
    .skin-fox .cheek.r { right: 2px; }
    .skin-fox .tail {
      width: 40px; height: 16px; right: -14px; top: 66px;
      background: linear-gradient(90deg, #ea580c, #fff);
      border-radius: 16px; animation: tail 1s ease-in-out infinite;
    }

    .skin-panda .head, .skin-panda .torso {
      background: linear-gradient(160deg, #f8fafc, #e2e8f0);
    }
    .skin-panda .arm-l, .skin-panda .arm-r,

  <script>
    const FORMS = [
      { id: 'cat', name: '小猫', emoji: '🐱' },
      { id: 'dog', name: '小狗', emoji: '🐶' },
      { id: 'bunny', name: '兔子', emoji: '🐰' },
      { id: 'fox', name: '狐狸', emoji: '🦊' },
      { id: 'panda', name: '熊猫', emoji: '🐼' }
    ];

    const canvas = document.getElementById('fx');
    const ctx = canvas.getContext('2d');
    const cursor = document.getElementById('cursor');
    const pet = document.getElementById('pet');
    const figure = document.getElementById('figure');
    const bubble = document.getElementById('bubble');
    const picker = document.getElementById('picker');

    let w = 0, h = 0, particles = [], mouse = { x: 0, y: 0 }, t = 0;

    let currentAudio = null;


    // Local audio cache (Cache API)
    const AUDIO_CACHE = 'petworld-audio-v1';
    const audioUrlMemo = new Map();

    async function listAllAudioPaths() {
      const paths = new Set();
      const add = (u) => { if (u && typeof u === 'string') paths.add(u.replace(/^\.\//, '')); };
      try {
        const [words, actions, dialogs, foods] = await Promise.all([
          fetch('words.json').then((r) => r.json()),
          fetch('actions.json').then((r) => r.json()),
          fetch('dialogs.json').then((r) => r.json()),
          fetch('foods.json').then((r) => r.json()),
        ]);
        (words.items || []).forEach((it) => { add(it.audio); add(it.phonicsAudio); });
        Object.values(actions.actions || {}).forEach((arr) => arr.forEach((it) => add(it.audio)));
        (dialogs.dialogs || []).forEach((it) => add(it.audio));
        (foods.foods || []).forEach((it) => {
          if (it.accept) add(it.accept.audio);
          if (it.reject) add(it.reject.audio);
        });
        if (foods.genericAccept) add(foods.genericAccept.audio);
        if (foods.genericReject) add(foods.genericReject.audio);
        if (foods.askFood) add(foods.askFood.audio);
        add('audio/good_morning.mp3');
        if (ANIMALS && ANIMALS.animals) {
          ANIMALS.animals.forEach((a) => add(a.audio));
        }
        if (PLAYS && PLAYS.plays) {
          PLAYS.plays.forEach((p) => add(p.audio));
          if (PLAYS.generic) add(PLAYS.generic.audio);
        }
      } catch (e) {
        console.warn('list audio failed', e);
      }
      return [...paths];
    }

    async function getPlayableUrl(path) {
      if (!path) return path;
      if (audioUrlMemo.has(path)) return audioUrlMemo.get(path);
      try {
        if (window.caches) {
          const cache = await caches.open(AUDIO_CACHE);
          const req = new Request(path, { cache: 'reload' });
          let res = await cache.match(path);
          if (!res) res = await cache.match(req);
          if (res) {
            const blob = await res.blob();
            const url = URL.createObjectURL(blob);
            audioUrlMemo.set(path, url);
            return url;
          }
        }
      } catch (e) {}
      return path;
    }

    async function playCachedAudio(path, { rate = 1 } = {}) {
      const url = await getPlayableUrl(path);
      if (currentAudio) { currentAudio.pause(); currentAudio = null; }
      const audio = new Audio(url);
      audio.playbackRate = rate;
      currentAudio = audio;
      try { await audio.play(); } catch (e) {}
      return audio;
    }

    async function preloadAllAudio() {
      const btn = document.getElementById('preloadBtn');
      if (!btn || btn.classList.contains('busy')) return;
      if (!window.caches) {
        say('当前浏览器不支持缓存', 2400);
        return;
      }
      btn.classList.add('busy');
      btn.classList.remove('done');
      const paths = await listAllAudioPaths();
      const cache = await caches.open(AUDIO_CACHE);
      let done = 0, fail = 0;
      btn.textContent = `下载中 0/${paths.length}`;
      for (const path of paths) {
        try {
          const hit = await cache.match(path);
          if (!hit) {
            const res = await fetch(path, { cache: 'reload' });
            if (!res.ok) throw new Error('bad status');
            await cache.put(path, res.clone());
          }
          done += 1;
        } catch (e) {
          fail += 1;
        }
        btn.textContent = `下载中 ${done + fail}/${paths.length}`;
      }
      btn.classList.remove('busy');
      btn.classList.add('done');
      btn.textContent = fail ? `已缓存 ${done}，失败 ${fail}` : `音频已缓存 ${done}`;
      say(fail ? '部分音频缓存失败' : '音频已预下载到本地', 2200);
      localStorage.setItem('proto-audio-preloaded', '1');
    }

    async function refreshPreloadButton() {
      const btn = document.getElementById('preloadBtn');
      if (!btn || !window.caches) return;
      try {
        const paths = await listAllAudioPaths();
        const cache = await caches.open(AUDIO_CACHE);
        let n = 0;
        for (const path of paths) {
          if (await cache.match(path)) n += 1;
        }
        if (n >= paths.length && paths.length) {
          btn.classList.add('done');
          btn.textContent = `音频已缓存 ${n}`;
        } else if (n > 0) {
          btn.textContent = `预下载音频 ${n}/${paths.length}`;
        }
      } catch (e) {}
    }

      const t = (text || '').toLowerCase().trim();

      let best = null, bestLen = 0;
      for (const a of ANIMALS.animals) {
        for (const trig of a.triggers) {
          const g = String(trig).toLowerCase();
          // word-boundary-ish for english; substring for CJK
          const isCjk = /[\u4e00-\u9fff]/.test(g);
          const hit = isCjk ? t.includes(g) : (new RegExp(`(^|[^a-z])${g}([^a-z]|$)`)).test(t);
          if (hit && g.length >= bestLen) {
            best = a; bestLen = g.length;
          }
        }
      }
      return best;
    }

    function maybeHandleAnimalCommand(text) {
      const t = (text || '').toLowerCase().trim();
      if (!t) return false;
      // Avoid eating "fish" etc. stealing animal intent only for animal words
      // Prefer explicit become/I am / change to patterns, or bare animal name
      const animal = findAnimal(t);
      if (!animal) return false;
      const explicit = /\b(i am|i'm|im|be|become|change to|switch to|turn into)\b/.test(t)
        || /我是|变成|切换|换/.test(text || '');
      const bare = t === animal.name || t === animal.id || animal.triggers.some((g) => t === String(g).toLowerCase());
      // Also allow "cat please" / just "cat"
      const shortAnimal = animal.triggers.some((g) => {
        const gg = String(g).toLowerCase();
        return t === gg || t === `${gg}s` || t.startsWith(gg + ' ') || t.endsWith(' ' + gg);
      });
      if (explicit || bare || shortAnimal) {
        // If it's an eat command with food, let eat handler win (checked first)
        return switchAnimal(animal);
      }
      return false;
    }

          const g = trig.toLowerCase();
          if (t.includes(g) && g.length >= bestLen) {
            best = d;
            bestLen = g.length;
          }
        }
      }
      return best || DIALOGS.dialogs.find((d) => d.id === 'fallback');
    }

    function speakDialog(d) {
      if (!d) return;
      if (d.id === 'lets_play' || d.id === 'play') {
        startPlay(null);
        return;
      }
      playCachedAudio(d.audio);
      say(d.reply, 5200);
      setHappy(1800);
      if (d.id === 'good_night' || d.id === 'i_am_sleepy' || d.id === 'sleep') {
        state.holdUntil = 0;
        actionVisual('sleep');
        state.mode = 'sleep';
        pet.classList.add('sleep');
        pet.classList.remove('walk', 'happy');
        state.vx = 0; state.vy = 0;
      } else if (d.id === 'i_am_hungry' || d.id === 'hungry') {
        holdStill(3600);
        actionVisual('feed');
      } else if (d.id === 'i_love_you' || d.id === 'love') {
        holdStill(3200);
        actionVisual('pet');
      } else if (d.id === 'hello' || d.id === 'greet' || d.id === 'good_morning') {
        holdStill(2800);
        hearts(3);
        burst(['👋', '✨', '💖'], state.x, state.y - 70);
      }
    }

    let lastHeard = '';
    let recognizing = false;
    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    if (SpeechRec) {
      recognition = new SpeechRec();
      recognition.lang = 'en-US';
      recognition.interimResults = false;
      recognition.maxAlternatives = 3;
      recognition.continuous = false;
      recognition.onstart = () => {
        recognizing = true;
        document.getElementById('micBtn').classList.add('listening');
        document.getElementById('micBtn').textContent = '🎤...';
      };
      recognition.onend = () => {
        recognizing = false;
        document.getElementById('micBtn').classList.remove('listening');
        document.getElementById('micBtn').textContent = '🎤';
      };
      recognition.onerror = (e) => {
        recognizing = false;
        document.getElementById('micBtn').classList.remove('listening');
        document.getElementById('micBtn').textContent = '🎤';
        const msg = {
          'not-allowed': 'Microphone blocked. Please allow mic access and try again.',
          'no-speech': 'No speech heard. Please try again.',
          'audio-capture': 'No microphone found.',
          'network': 'Speech recognition needs network. Check connection.'
        }[e.error] || ('识别出错：' + e.error);
        say(msg, 2400);
      };
      recognition.onresult = (ev) => {
        const alts = [];
        for (let i = 0; i < ev.results[0].length; i++) alts.push(ev.results[0][i].transcript);
        lastHeard = alts[0] || '';
        // Eat commands first: "eat apple"
        let ate = false;
        for (const a of alts) {
          if (maybeHandleEatCommand(a)) { ate = true; break; }
        }
        if (ate) return;
        // Animal switch: "cat" / "I am a dog"
        let switched = false;
        for (const a of alts) {
          if (maybeHandleAnimalCommand(a)) { switched = true; break; }
        }
        if (switched) return;
        let played = false;
        for (const a of alts) {
          if (maybeHandlePlayCommand(a)) { played = true; break; }
        }
        if (played) return;
        let matched = null;
        for (const a of alts) {
          matched = matchDialog(a);
          if (matched && matched.id !== 'fallback') break;
        }
        if (!matched) matched = matchDialog(lastHeard);
        speakDialog(matched);
      };
    }

    document.getElementById('micBtn').addEventListener('click', () => {
      if (!recognition) {
        say('Please use Chrome or Edge', 2400);
        return;
      }
      if (recognizing) {
        recognition.stop();
        return;
      }
      try {
        // Prefer Chinese; English triggers still match via lowercase includes
        recognition.lang = 'en-US';
        recognition.start();
      } catch (err) {
        say('Cannot start microphone', 2400);
      }
    });


    let ACTION_LINES = null;

    async function loadActions() {
      const res = await fetch('actions.json');
      ACTION_LINES = await res.json();
    }
    loadActions();

    function speakAction(kind) {
      if (!ACTION_LINES || !ACTION_LINES.actions || !ACTION_LINES.actions[kind]) return;
      const list = ACTION_LINES.actions[kind];
      const it = list[Math.floor(Math.random() * list.length)];
      if (currentAudio) { currentAudio.pause(); currentAudio = null; }
      playCachedAudio(it.audio);
      say(it.text, 4400);
      // sync learning panel if possible
      if (typeof showWord === 'function' && WORDS && WORDS.items) {
        // keep panel as-is; bubble shows English
      }
    }

    function act(kind) {
      if (kind === 'pet') {
        holdStill(3200);
        setHappy(1800);
        actionVisual('pet');
        speakAction('pet');
      } else if (kind === 'feed') {
        holdStill(3600);
        setHappy(2000);
        actionVisual('feed');
        speakAction('feed');
      } else if (kind === 'play') {
        startPlay(null);
      } else if (kind === 'sleep') {
        state.mode = 'sleep';
        state.holdUntil = 0;
        pet.classList.add('sleep');
        pet.classList.remove('walk', 'happy');
        state.vx = 0; state.vy = 0;
        actionVisual('sleep');
        speakAction('sleep');
        setTimeout(() => {
          if (state.mode === 'sleep') {
            pet.classList.remove('sleep');
            state.mode = 'wander';
            pickWanderTarget();
            say('Good morning', 3600);
            playCachedAudio('audio/good_morning.mp3');
          }
        }, 9000);
      }
    }

    function resize() {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
      particles = Array.from({ length: Math.min(110, Math.floor(w * h / 15000)) }, () => ({
        x: Math.random() * w,
        y: Math.random() * h,
        z: Math.random() * 0.8 + 0.2,
        vx: (Math.random() - 0.5) * 0.4,
        vy: (Math.random() - 0.5) * 0.4,
        hue: 180 + Math.random() * 140
      }));
      state.x = Math.min(Math.max(60, state.x), w - 60);
      state.y = Math.min(Math.max(120, state.y), h - 40);
      pickWanderTarget();
    }

    function drawFx() {
      t += 0.016;
      ctx.clearRect(0, 0, w, h);
      ctx.strokeStyle = 'rgba(148,163,184,0.05)';
      const gap = 56;
      const ox = (mouse.x * 0.02) % gap;
      const oy = (mouse.y * 0.02) % gap;
      for (let x = -gap + ox; x < w + gap; x += gap) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
      }
      for (let y = -gap + oy; y < h + gap; y += gap) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
      }
      for (const p of particles) {
        p.x += p.vx + Math.sin(t + p.y * 0.01) * 0.15;
        p.y += p.vy + Math.cos(t + p.x * 0.01) * 0.15;
        if (p.x < -20) p.x = w + 20;
        if (p.x > w + 20) p.x = -20;
        if (p.y < -20) p.y = h + 20;
        if (p.y > h + 20) p.y = -20;
        ctx.beginPath();
        ctx.fillStyle = `hsla(${p.hue}, 90%, 70%, ${0.3 + p.z * 0.4})`;
        ctx.shadowColor = `hsla(${p.hue}, 90%, 70%, 0.7)`;
        ctx.shadowBlur = 10;
        ctx.arc(p.x, p.y, 1.2 + p.z * 2.1, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.shadowBlur = 0;
    }

    function tickPet(now) {
      if (now > state.moodUntil) pet.classList.remove('happy');

      // resume from hold if timer elapsed (safety)
      if (state.mode === 'hold' && performance.now() >= state.holdUntil) {
        state.mode = state.holdPrevMode === 'sleep' ? 'wander' : (state.holdPrevMode || 'wander');
        state.holdPrevMode = null;
        if (state.mode === 'wander') pickWanderTarget();
      }

      let tx = state.x, ty = state.y;
      if (state.mode === 'hold') {
        tx = state.x; ty = state.y;
        state.vx = 0; state.vy = 0;
      } else if (state.mode === 'follow') {
        tx = mouse.x;
        ty = mouse.y + 10;
      } else if (state.mode === 'wander') {
        if (now > state.nextWanderAt || Math.hypot(state.target.x - state.x, state.target.y - state.y) < 18) {
          pickWanderTarget();
        }
        tx = state.target.x;
        ty = state.target.y;
      }

      if (state.mode !== 'sleep' && state.mode !== 'hold') {
        const dx = tx - state.x;
        const dy = ty - state.y;
        const dist = Math.hypot(dx, dy) || 1;
        const speed = state.mode === 'follow' ? 1.6 : 0.55;
        if (dist > 8) {
          state.vx += (dx / dist) * speed * 0.35;
          state.vy += (dy / dist) * speed * 0.35;
        }
      } else {
        state.vx = 0;
        state.vy = 0;
      }

      state.vx *= 0.88;
      state.vy *= 0.88;
      state.x += state.vx;
      state.y += state.vy;
      state.x = Math.max(50, Math.min(w - 50, state.x));
      state.y = Math.max(120, Math.min(h - 30, state.y));

      const moving = Math.hypot(state.vx, state.vy) > 0.18 && state.mode !== 'sleep';
      if (!pet.classList.contains('acting')) pet.classList.toggle('walk', moving);
      else pet.classList.remove('walk');
      if (Math.abs(state.vx) > 0.08) state.facing = state.vx < 0 ? -1 : 1;

      pet.style.left = state.x + 'px';
      pet.style.top = state.y + 'px';
      pet.style.transform = 'translate(-50%, -100%)';
      // face left/right on body only, keep bubble text unmirrored
      figure.style.setProperty('--face', String(state.facing));
      figure.style.transform = `scaleX(${state.facing})`;
    }

    function loop(now) {
      drawFx();
      tickPet(now || performance.now());
      requestAnimationFrame(loop);
    }

    window.addEventListener('resize', resize);
    window.addEventListener('pointermove', (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
      cursor.style.left = e.clientX + 'px';
      cursor.style.top = e.clientY + 'px';
    });

    pet.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      e.stopPropagation();
      pet.setPointerCapture(e.pointerId);
      state.pressing = true;
      clearTimeout(state.longPressTimer);
      state.longPressTimer = setTimeout(() => {
        if (!state.pressing) return;
        state.mode = 'follow';
        pet.classList.remove('sleep');
        say('跟着你～');
      }, 380);
    });

    function endPress() {
      if (!state.pressing) return;
      const wasFollow = state.mode === 'follow';
      state.pressing = false;
      clearTimeout(state.longPressTimer);
      if (wasFollow) {
        state.mode = 'wander';
        pickWanderTarget();
        say('我自己逛逛');
      } else {
        // short click: randomly pick and read an English item
        playRandomWord();
      }
    }

    pet.addEventListener('pointerup', endPress);
    pet.addEventListener('pointercancel', endPress);

    picker.addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-form]');
      if (!btn) return;
      setForm(btn.dataset.form);
    });

    document.querySelectorAll('.panel button').forEach((btn) => {
      btn.addEventListener('click', () => act(btn.dataset.act));
    });


    // English learning (neural audio, not browser TTS)
    let WORDS = { items: [] };
    let wordIndex = 0;
    // currentAudio declared earlier for action speech


    let wordFilter = '';
    function visibleWordIndexes() {
      const q = (wordFilter || '').trim().toLowerCase();
      const items = WORDS.items || [];
      if (!q) return items.map((_, i) => i);
      return items.map((it, i) => i).filter((i) => {
        const it = items[i];
        const bag = [it.text, it.zh, it.ipa, it.phonics, it.id].join(' ').toLowerCase();
        return bag.includes(q);
      });
    }

    function renderWordList(activeIndex = wordIndex) {
      const list = document.getElementById('enList');
      const meta = document.getElementById('enSearchMeta');
      if (!list) return;
      const idxs = visibleWordIndexes();
      if (meta) meta.textContent = wordFilter.trim() ? `找到 ${idxs.length} 个` : `共 ${ (WORDS.items||[]).length } 个单词`;
      list.innerHTML = idxs.map((i) => {
        const it = WORDS.items[i];
        return `<button type="button" data-i="${i}" class="${i === activeIndex ? 'active' : ''}">${it.text}</button>`;
      }).join('');
    }

    async function loadWords() {
      const res = await fetch('words.json');
      WORDS = await res.json();
      const idxs = visibleWordIndexes();
      showWord(idxs[0] || 0);
      renderWordList(wordIndex);
    }

    function showWord(i) {
      wordIndex = (i + WORDS.items.length) % WORDS.items.length;
      const it = WORDS.items[wordIndex];
      document.getElementById('enWord').textContent = it.text;
      const segs = it.ipaSegments || [];
      document.getElementById('enIpa').innerHTML = segs.length
        ? segs.map((s) => `<span class="ipa-chip">/${s}/</span>`).join(' ')
        : it.ipa;
      document.getElementById('enPhonics').textContent = '音标逐个读 · ' + it.ipa;
      document.getElementById('enZh').textContent = it.zh;
      renderWordList(wordIndex);
    }

    function stopAudio() {
      if (currentAudio) {
        currentAudio.pause();
        currentAudio = null;
      }
    }

    function playWord({ slow = false, phonics = false } = {}) {
      const it = WORDS.items[wordIndex];
      if (!it) return;
      stopAudio();
      const src = phonics && it.phonicsAudio ? it.phonicsAudio : it.audio;
      playCachedAudio(src, { rate: slow ? 0.78 : 1 });
      say(phonics ? ('拼读：' + it.phonics) : it.text);
      setHappy(1400);
    }

    function playRandomWord() {
      if (!WORDS.items.length) return;
      const i = Math.floor(Math.random() * WORDS.items.length);
      showWord(i);
      playWord();
    }

    const enSearch = document.getElementById('enSearch');
    if (enSearch) {
      enSearch.addEventListener('input', () => {
        wordFilter = enSearch.value || '';
        const idxs = visibleWordIndexes();
        if (idxs.length && !idxs.includes(wordIndex)) showWord(idxs[0]);
        else renderWordList(wordIndex);
      });
    }
    document.getElementById('btnPlay').addEventListener('click', () => playWord());
    document.getElementById('btnPhonics').addEventListener('click', () => playWord({ phonics: true }));
    document.getElementById('btnSlow').addEventListener('click', () => playWord({ slow: true }));
    document.getElementById('btnNext').addEventListener('click', () => { showWord(wordIndex + 1); playWord(); });

    function applyDock(key, hidden) {
      document.body.classList.toggle('hide-' + key, hidden);
      localStorage.setItem('proto-hide-' + key, hidden ? '1' : '0');
      const map = { picker: 'togglePicker', learn: 'toggleLearn', actions: 'toggleActions' };
      const labels = { picker: '形象', learn: '英语', actions: '操作' };
      const btn = document.getElementById(map[key]);
      if (btn) btn.textContent = (hidden ? '展开' : '收起') + labels[key];
    }
    ['picker','learn','actions'].forEach((key) => {
      // default collapsed unless user explicitly expanded (saved as '0')
      const saved = localStorage.getItem('proto-hide-' + key);
      applyDock(key, saved !== '0');
    });
    document.getElementById('togglePicker').addEventListener('click', () => {
      applyDock('picker', !document.body.classList.contains('hide-picker'));
    });
    document.getElementById('toggleLearn').addEventListener('click', () => {
      applyDock('learn', !document.body.classList.contains('hide-learn'));
    });
    document.getElementById('toggleActions').addEventListener('click', () => {
      applyDock('actions', !document.body.classList.contains('hide-actions'));
    });
    document.getElementById('enList').addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-i]');
      if (!btn) return;
      showWord(Number(btn.dataset.i));
      playWord();
    });

    loadWords();

    const saved = localStorage.getItem('proto-pet-form');
    state.form = FORMS.some((f) => f.id === saved) ? saved : 'cat';
    buildFigure(state.form);
    applyEnv(state.form);
    renderPicker();
    resize();
    mouse.x = state.x; mouse.y = state.y - 40;
    say('选形象，长按我会跟着你', 2400);
    loop();
  </script>
</body>
</html>
